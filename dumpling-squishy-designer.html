<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dumpling Squishy Designer Deluxe</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap');

:root{
    --dumpling:#ffb7c9;
    --accent:#ff6f98;
    --accent2:#ffd66f;
    --ink:#4c3934;
    --soft:#fff8f3;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:"Fredoka",Arial,sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    background:
        radial-gradient(circle at 10% 10%,#ffd9e6 0 5%,transparent 24%),
        radial-gradient(circle at 90% 15%,#ffeab8 0 5%,transparent 24%),
        radial-gradient(circle at 50% 100%,#d9f3df 0 5%,transparent 30%),
        #fff7f1;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

button:active{
    transform:scale(.96);
}

/* =========================================================
   HEADER
========================================================= */

header{
    max-width:1550px;
    margin:auto;
    padding:16px 22px 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:62px;
    height:62px;
    display:grid;
    place-items:center;

    font-size:34px;

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            #ffc4d6,
            #ff7fa5
        );

    box-shadow:
        inset 0 6px 9px #ffffffaa,
        inset 0 -8px 10px #c95b7a55,
        0 10px 20px #b9698130;

    transform:rotate(-5deg);

    animation:
        logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    50%{
        transform:
            rotate(4deg)
            translateY(-4px);
    }
}

h1{
    margin:0;
    font-size:clamp(26px,4vw,42px);
    line-height:.95;
    font-weight:800;
    color:#593f36;
}

.tagline{
    margin-top:5px;
    color:#99776a;
    font-size:14px;
}

.headerButtons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.topButton{
    background:#ffffffdd;
    border:2px solid #f0ddd3;
    color:#74564b;
    padding:10px 14px;
    border-radius:15px;
    font-weight:700;
    box-shadow:0 5px 12px #8f665014;
}

/* =========================================================
   MAIN LAYOUT
========================================================= */

.layout{
    max-width:1550px;
    margin:auto;

    padding:8px 22px 28px;

    display:grid;
    grid-template-columns:minmax(0,1fr) 405px;
    gap:20px;
}

/* =========================================================
   PREVIEW AREA
========================================================= */

.stage{
    min-height:730px;

    position:relative;
    overflow:hidden;

    border-radius:34px;

    border:2px solid #f1ddd3;

    background:
        radial-gradient(
            ellipse at 50% 38%,
            #ffffff 0 14%,
            transparent 15%
        ),
        radial-gradient(
            ellipse at 50% 75%,
            #ffece2,
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #fffdfb,
            #fff0e7
        );

    box-shadow:
        0 20px 55px #78503916,
        inset 0 1px 0 white;
}

/* soft stage lighting */

.stage::before{
    content:"";
    position:absolute;

    width:650px;
    height:240px;

    left:50%;
    bottom:38px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            #e8c3ad66,
            transparent 67%
        );

    filter:blur(13px);
}

.stage::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            120deg,
            #ffffff55,
            transparent 25%,
            transparent 75%,
            #ffcbb522
        );

    pointer-events:none;
}

/* =========================================================
   FLOATING SPARKLES
========================================================= */

.sparkles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.sparkle{
    position:absolute;
    color:white;
    text-shadow:0 2px 8px #ffacc6aa;
    opacity:.7;
    animation:
        sparkleFloat 4s ease-in-out infinite;
}

.sparkle:nth-child(1){
    left:9%;
    top:19%;
    font-size:26px;
}

.sparkle:nth-child(2){
    right:12%;
    top:24%;
    font-size:18px;
    animation-delay:.7s;
}

.sparkle:nth-child(3){
    left:16%;
    bottom:23%;
    font-size:20px;
    animation-delay:1.4s;
}

.sparkle:nth-child(4){
    right:17%;
    bottom:20%;
    font-size:28px;
    animation-delay:2s;
}

.sparkle:nth-child(5){
    left:27%;
    top:13%;
    font-size:13px;
    animation-delay:2.7s;
}

@keyframes sparkleFloat{
    50%{
        transform:
            translateY(-15px)
            rotate(18deg)
            scale(1.2);
        opacity:1;
    }
}

/* =========================================================
   DUMPLING
========================================================= */

.dumplingWrap{
    width:min(650px,82vw);
    height:min(560px,70vw);

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-47%);

    display:grid;
    place-items:center;
}

.dumpling{
    width:430px;
    height:340px;

    position:relative;

    transform:
        translateY(12px)
        rotate(-1deg);

    transition:
        transform .25s ease,
        filter .25s ease;

    filter:
        drop-shadow(
            0 28px 20px #80523b32
        );
}

.dumpling:hover{
    transform:
        translateY(6px)
        rotate(1deg)
        scale(1.015);
}

/* =========================================================
   DUMPLING SHADOW
========================================================= */

.dumplingShadow{
    position:absolute;

    width:350px;
    height:65px;

    left:50%;
    bottom:-5px;

    transform:translateX(-50%);

    border-radius:50%;

    background:#8d5d4528;

    filter:blur(11px);

    z-index:-1;
}

/* =========================================================
   BODY
========================================================= */

.body{
    position:absolute;

    left:15px;
    right:15px;

    bottom:15px;

    height:245px;

    overflow:hidden;

    border-radius:
        47% 47% 38% 38%
        /
        68% 68% 28% 28%;

    background:
        var(--dumpling);

    box-shadow:

        inset
        20px 18px 28px
        #ffffff72,

        inset
        -26px -29px 32px
        #81465b20,

        inset
        0 -9px 8px
        #ffffff25;
}

.body::before{
    content:"";

    position:absolute;
    inset:-10%;

    background:
        radial-gradient(
            ellipse at 28% 18%,
            #ffffff8c,
            transparent 24%
        ),
        radial-gradient(
            ellipse at 74% 83%,
            #6f3d5016,
            transparent 35%
        );

    pointer-events:none;
}

.body::after{
    content:"";

    position:absolute;
    inset:12px;

    border-radius:inherit;

    background:
        linear-gradient(
            130deg,
            #ffffff30,
            transparent 22%,
            transparent 70%,
            #7d4b5510
        );

    pointer-events:none;
}

/* =========================================================
   TOP
========================================================= */

.top{
    position:absolute;

    left:13px;
    right:13px;

    top:42px;

    height:175px;

    background:
        var(--dumpling);

    border-radius:
        53% 53% 42% 42%
        /
        72% 72% 42% 42%;

    box-shadow:

        inset
        15px 12px 20px
        #ffffff65,

        inset
        -14px -15px 20px
        #74415018;

    z-index:2;
}

.top::after{
    content:"";

    position:absolute;

    width:130px;
    height:52px;

    left:57px;
    top:30px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            #ffffff66,
            transparent 68%
        );

    filter:blur(5px);

    transform:rotate(-15deg);
}

/* =========================================================
   FOLDS
========================================================= */

.fold{
    position:absolute;

    width:137px;
    height:48px;

    top:22px;

    border-radius:50%;

    border-top:
        12px solid #ffffff48;

    border-bottom:
        8px solid #7944521c;

    z-index:5;

    filter:
        blur(.2px);
}

.fold.f1{
    left:37px;
    transform:rotate(-15deg);
}

.fold.f2{
    left:146px;
    top:15px;
}

.fold.f3{
    right:31px;
    transform:rotate(15deg);
}

/* central tip */

.tip{
    position:absolute;

    width:76px;
    height:42px;

    left:50%;
    top:14px;

    transform:translateX(-50%);

    border-radius:
        50% 50% 35% 35%;

    background:
        var(--dumpling);

    box-shadow:
        inset 0 6px 9px #ffffff45;

    z-index:4;
}

/* =========================================================
   PATTERN
========================================================= */

.pattern{
    position:absolute;
    inset:0;

    z-index:6;

    pointer-events:none;
}

.pattern.spots{
    background-image:

        radial-gradient(
            circle at 17% 27%,
            #ffffff66 0 11px,
            transparent 12px
        ),

        radial-gradient(
            circle at 72% 63%,
            #ffffff42 0 15px,
            transparent 16px
        ),

        radial-gradient(
            circle at 42% 77%,
            #8d526015 0 9px,
            transparent 10px
        ),

        radial-gradient(
            circle at 82% 24%,
            #8d526018 0 7px,
            transparent 8px
        );
}

.pattern.stripes{
    background:
        repeating-linear-gradient(
            18deg,
            transparent 0 21px,
            #ffffff38 22px 31px,
            transparent 32px 49px
        );
}

.pattern.confetti{
    background-image:

        radial-gradient(
            circle at 18% 30%,
            #ff628a 0 5px,
            transparent 6px
        ),

        radial-gradient(
            circle at 74% 35%,
            #ffffff 0 5px,
            transparent 6px
        ),

        radial-gradient(
            circle at 49% 72%,
            #63bce1 0 4px,
            transparent 5px
        ),

        radial-gradient(
            circle at 82% 76%,
            #f8cc4f 0 4px,
            transparent 5px
        );
}

.pattern.cherries::before,
.pattern.cherries::after{
    content:"🍒";

    position:absolute;

    font-size:35px;

    filter:
        drop-shadow(
            0 3px 2px #7654
        );
}

.pattern.cherries::before{
    left:18%;
    top:31%;
}

.pattern.cherries::after{
    right:18%;
    bottom:23%;
}

.pattern.rainbow{
    background:
        conic-gradient(
            from 205deg at 50% 115%,
            #ff789b,
            #ffc86b,
            #fff17c,
            #9ce0ad,
            #81d7ec,
            #9c9be6,
            #ff9cc2
        );

    opacity:.32;
}

.pattern.heartPattern{
    background:none;
}

.heartPattern .miniHeart{
    position:absolute;
    color:#e65d83;
    font-size:27px;
}

.pattern.glitter{
    background-image:
        radial-gradient(circle,#ffffff 0 2px,transparent 3px),
        radial-gradient(circle,#ffffff 0 1px,transparent 2px);

    background-size:
        46px 40px,
        31px 28px;

    opacity:.7;
}

/* =========================================================
   FACE
========================================================= */

.face{
    position:absolute;

    left:50%;
    top:116px;

    transform:
        translateX(-50%);

    display:flex;

    gap:65px;

    align-items:center;

    z-index:10;
}

.eye{
    width:14px;
    height:19px;

    border-radius:50%;

    background:
        #473936;

    box-shadow:
        inset 3px 2px 2px #ffffff55;
}

.blush{
    position:absolute;

    width:45px;
    height:19px;

    border-radius:50%;

    background:
        #ff739555;

    top:44px;

    filter:blur(1px);
}

.blush.l{
    left:-58px;
}

.blush.r{
    right:-58px;
}

.mouth{
    position:absolute;

    width:21px;
    height:13px;

    left:50%;
    top:39px;

    transform:translateX(-50%);

    border-bottom:
        4px solid #473936;

    border-radius:
        0 0 50% 50%;
}

/* =========================================================
   ACCESSORY
========================================================= */

.accessory{
    position:absolute;

    z-index:14;

    left:50%;
    top:-8px;

    transform:
        translateX(-50%);

    font-size:57px;

    white-space:nowrap;

    filter:
        drop-shadow(
            0 5px 3px #68423555
        );

    transition:
        transform .2s;
}

/* =========================================================
   STICKERS
========================================================= */

.sticker{
    position:absolute;

    z-index:15;

    font-size:43px;

    filter:
        drop-shadow(
            0 4px 3px #68423555
        );

    animation:
        stickerFloat 3s ease-in-out infinite;
}

.sticker.one{
    left:45px;
    bottom:58px;
}

.sticker.two{
    right:45px;
    bottom:72px;

    animation-delay:1s;
}

@keyframes stickerFloat{
    50%{
        transform:
            translateY(-4px)
            rotate(5deg);
    }
}

/* =========================================================
   CONTROLS PANEL
========================================================= */

.controls{
    background:#ffffffee;

    border:
        2px solid #f1ddd3;

    border-radius:29px;

    padding:18px;

    box-shadow:
        0 18px 45px #76503913;

    max-height:
        calc(100vh - 96px);

    overflow:auto;

    backdrop-filter:
        blur(8px);
}

.controls::-webkit-scrollbar{
    width:8px;
}

.controls::-webkit-scrollbar-thumb{
    background:#ecd5ca;
    border-radius:20px;
}

.section{
    padding-bottom:17px;
    margin-bottom:16px;

    border-bottom:
        1px solid #f2e4dc;
}

.section:last-child{
    border-bottom:0;
}

.panelTitle{
    margin:2px 0 10px;

    font-size:18px;
    font-weight:800;

    color:#60473d;
}

/* =========================================================
   COLOUR SWATCHES
========================================================= */

.swatches{
    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:7px;
}

.swatch{
    aspect-ratio:1;

    border:
        3px solid white;

    border-radius:13px;

    box-shadow:
        0 3px 7px #76524335;

    transition:
        transform .15s,
        box-shadow .15s;
}

.swatch.selected{
    outline:
        3px solid #60473d;

    transform:
        scale(1.08);

    box-shadow:
        0 5px 12px #76524344;
}

/* =========================================================
   OPTIONS
========================================================= */

.optionGrid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.option{
    min-height:48px;

    padding:7px;

    border:
        2px solid #efddd5;

    border-radius:14px;

    background:#fffaf7;

    color:#705348;

    font-weight:700;

    font-size:13px;

    transition:
        background .15s,
        border .15s,
        transform .15s;
}

.option:hover{
    background:#fff0f5;
}

.option.selected{
    border-color:#e17e9a;

    background:#fff0f5;

    color:#b14c68;

    box-shadow:
        0 4px 12px #d878941d;
}

.patternGrid{
    grid-template-columns:
        repeat(4,1fr);
}

/* =========================================================
   MUSIC
========================================================= */

.musicPanel{
    padding:12px;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #fff1f6,
            #fff9e9
        );

    border:
        2px solid #f1dfe0;
}

.musicTop{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:8px;
}

.musicTitle{
    font-size:15px;
    font-weight:800;
}

.musicButton{
    padding:9px 12px;

    border-radius:12px;

    background:#ff8eac;

    color:white;

    font-weight:800;
}

.volumeRow{
    display:flex;
    align-items:center;
    gap:9px;

    margin-top:9px;
}

.volumeRow input{
    width:100%;
    accent-color:#ff7e9f;
}

/* =========================================================
   NAME
========================================================= */

.nameBox{
    display:flex;
    gap:7px;
}

.nameBox input{
    flex:1;

    min-width:0;

    padding:10px;

    border:
        2px solid #efdcd3;

    border-radius:13px;

    outline:none;

    color:#65483d;

    font-size:14px;
}

.nameBox input:focus{
    border-color:#e999af;
}

.nameBox button{
    padding:0 14px;

    border-radius:13px;

    background:#ffe0ea;

    color:#a94d68;

    font-weight:800;
}

/* =========================================================
   ACTIONS
========================================================= */

.actionRow{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;
}

.bigButton{
    padding:13px;

    border-radius:15px;

    font-size:15px;
    font-weight:800;
}

.randomButton{
    background:#70bd94;
    color:white;

    box-shadow:
        0 5px 10px #65a98430;
}

.resetButton{
    background:#f6e1d8;
    color:#77584d;
}

.squishButton{
    width:100%;

    margin-top:9px;

    padding:16px;

    border-radius:17px;

    color:white;

    font-size:19px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #ff9bb7,
            #ff7098
        );

    box-shadow:
        0 8px 18px #dd668824;

    position:relative;

    overflow:hidden;
}

.squishButton::before{
    content:"";

    position:absolute;

    width:120px;
    height:100px;

    left:-50px;
    top:-45px;

    background:#ffffff44;

    border-radius:50%;

    transform:rotate(25deg);
}

/* =========================================================
   SQUISH ANIMATION
========================================================= */

@keyframes megaSquish{

    0%{
        transform:
            translateY(10px)
            scale(1)
            rotate(-1deg);
    }

    18%{
        transform:
            translateY(20px)
            scaleX(1.12)
            scaleY(.89)
            rotate(0deg);
    }

    35%{
        transform:
            translateY(30px)
            scaleX(1.19)
            scaleY(.78)
            rotate(1deg);
    }

    53%{
        transform:
            translateY(-4px)
            scaleX(.94)
            scaleY(1.08)
            rotate(-2deg);
    }

    72%{
        transform:
            translateY(7px)
            scaleX(1.03)
            scaleY(.98);
    }

    100%{
        transform:
            translateY(10px)
            scale(1)
            rotate(-1deg);
    }
}

.squishing{
    animation:
        megaSquish .9s cubic-bezier(.2,.8,.2,1);
}

/* =========================================================
   CONFETTI
========================================================= */

.confettiPiece{
    position:fixed;

    z-index:100;

    pointer-events:none;

    font-size:25px;

    animation:
        confettiFly 1.25s ease-out forwards;
}

@keyframes confettiFly{

    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(
                var(--rotation)
            )
            scale(.4);

        opacity:0;
    }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,130px);

    padding:
        12px 20px;

    border-radius:30px;

    background:#4c3934;

    color:white;

    font-weight:700;

    z-index:200;

    box-shadow:
        0 10px 25px #4c393444;

    transition:
        transform .3s;
}

.toast.show{
    transform:
        translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1050px){

    .layout{
        grid-template-columns:1fr;
    }

    .controls{
        max-height:none;
    }

    .stage{
        min-height:650px;
    }
}

@media(max-width:600px){

    header{
        padding:
            12px 10px;
    }

    .logo{
        width:48px;
        height:48px;

        font-size:26px;
    }

    h1{
        font-size:24px;
    }

    .tagline{
        display:none;
    }

    .topButton{
        padding:
            8px 10px;

        font-size:12px;
    }

    .layout{
        padding:
            6px 10px 20px;

        gap:12px;
    }

    .stage{
        min-height:490px;
        border-radius:25px;
    }

    .dumplingWrap{
        width:350px;
        height:300px;
    }

    .dumpling{
        width:335px;
        height:275px;
    }

    .body{
        height:194px;
    }

    .top{
        height:140px;
        top:34px;
    }

    .fold{
        transform:scale(.78);
    }

    .fold.f1{
        left:22px;
    }

    .fold.f2{
        left:100px;
    }

    .fold.f3{
        right:18px;
    }

    .face{
        top:91px;
        gap:51px;
    }

    .accessory{
        font-size:45px;
    }

    .sticker{
        font-size:34px;
    }

    .sticker.one{
        left:32px;
    }

    .sticker.two{
        right:32px;
    }

    .controls{
        padding:14px;
        border-radius:23px;
    }

    .swatches{
        grid-template-columns:
            repeat(7,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="brand">

        <div class="logo">
            🥟
        </div>

        <div>

            <h1>
                Dumpling Squishy Designer
            </h1>

            <div class="tagline">
                Create your own super-cute squishy! ✨
            </div>

        </div>

    </div>

    <div class="headerButtons">

        <button
            class="topButton"
            id="musicTop">

/* =========================================================
   STATE

const state = {

    colour:0,

    finish:"soft",

    pattern:"plain",

    accessory:"",

    sticker1:"💖",

    sticker2:"🍓",

    face:"happy",

    name:""

};


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;

let musicPlaying = false;

let musicTimer = null;

let musicStep = 0;

let masterGain = null;


/* initialise audio */

function initAudio(){

    if(audioContext){
        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        Number(
            document.getElementById("volume").value
        ) / 100;

    masterGain.connect(
        audioContext.destination
    );

}


/* play a note */

function playTone(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    if(!audioContext){
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        audioContext.currentTime + .015
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(masterGain);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration +
        .03
    );
}


/* cute squish sound */

function squishSound(){

    initAudio();

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        180,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        65,
        now + .22
    );

    gain.gain.setValueAtTime(
        .001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .18,
        now + .025
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + .32
    );

    oscillator.connect(gain);

    gain.connect(masterGain);

    oscillator.start(now);

    oscillator.stop(
        now + .35
    );

}


/* sparkle sound */

function sparkleSound(){

    initAudio();

    playTone(
        880,
        .12,
        "sine",
        .06
    );

    setTimeout(
        () =>
            playTone(
                1320,
                .18,
                "sine",
                .04
            ),
        70
    );

}


/* background melody */

const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    587.33,
    698.46,
    880,
    698.46,

    523.25,
    659.25,
    783.99,
    987.77,

    880,
    783.99,
    659.25,
    587.33

];


function musicTick(){

    if(!musicPlaying){
        return;
    }

    const frequency =
        melody[
            musicStep %
            melody.length
        ];

    playTone(
        frequency,
        .35,
        "sine",
        .025
    );

    if(
        musicStep % 4 === 0
    ){

        playTone(
            frequency / 2,
            .45,
            "triangle",
            .012
        );

    }

    musicStep++;

    musicTimer =
        setTimeout(
            musicTick,
            420
        );
}


/* music toggle */

function toggleMusic(){

    initAudio();

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    musicPlaying =
        !musicPlaying;

    const button =
        document.getElementById(
            "musicButton"
        );

    const top =
        document.getElementById(
            "musicTop"
        );

    if(musicPlaying){

        button.textContent =
            "⏸ Pause";

        top.textContent =
            "🎵 Music ON";

        musicStep = 0;

        musicTick();

        toast(
            "🎵 Dumpling music on!"
        );

    }else{

        button.textContent =
            "▶ Play";

        top.textContent =
            "🎵 Music";

        clearTimeout(
            musicTimer
        );

        toast(
            "🔇 Music paused"
        );

    }

}


/* =========================================================
   HELPERS
========================================================= */

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   CREATE OPTION BUTTONS
========================================================= */

function createOptions(
    containerId,
    items,
    handler,
    selected
){

    const container =
        $(containerId);

    container.innerHTML = "";

    items.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "option";

            const label =
                Array.isArray(item)
                    ? item[0]
                    : item;

            const value =
                Array.isArray(item)
                    ? item[1]
                    : item;

            button.textContent =
                label;

            button.dataset.value =
                value;

            if(
                value ===
                selected()
            ){

                button.classList.add(
                    "selected"
                );

            }

            button.onclick = () => {

                handler(value);

                container
                    .querySelectorAll(
                        ".option"
                    )
                    .forEach(
                        b =>
                            b.classList.remove(
                                "selected"
                            )
                    );

                button.classList.add(
                    "selected"
                );

                render();

                sparkleSound();

            };

            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const colour =
        colours[
            state.colour
        ][1];


    document.documentElement
        .style
        .setProperty(
            "--dumpling",
            colour
        );


    /* finish */

    const finishesMap = {

        soft:"",
        
        glossy:
            "linear-gradient(135deg,#ffffff35,transparent 35%,transparent 70%,#ffffff12)",

        pearl:
            "linear-gradient(135deg,#ffffff66,#ffa9d01c,#91e7f022,transparent)",

        velvet:
            "radial-gradient(circle at 25% 20%,#ffffff3d,transparent 30%),radial-gradient(circle at 75% 80%,#6e405015,transparent 40%)",

        jelly:
            "linear-gradient(135deg,#ffffff70,transparent 42%,#8de9ff1c)",

        sparkle:
            "radial-gradient(circle at 18% 25%,#ffffff 0 2px,transparent 3px),radial-gradient(circle at 75% 40%,#ffffff 0 2px,transparent 3px),radial-gradient(circle at 52% 75%,#ffffff 0 2px,transparent 3px)"

    };


    $("body")
        .style
        .backgroundImage =
            finishesMap[
                state.finish
            ] ||
            "none";


    $("top")
        .style
        .backgroundImage =
            finishesMap[
                state.finish
            ] ||
            "none";


    /* pattern */

    const pattern =
        $("pattern");

    pattern.className =
        "pattern";

    pattern.innerHTML = "";

    pattern.style.background =
        "";

    pattern.style.backgroundImage =
        "";

    pattern.style.opacity =
        "1";


    if(
        state.pattern ===
        "spots"
    ){

        pattern.classList.add(
            "spots"
        );

    }


    if(
        state.pattern ===
        "stripes"
    ){

        pattern.classList.add(
            "stripes"
        );

    }


    if(
        state.pattern ===
        "confetti"
    ){

        pattern.classList.add(
            "confetti"
        );

    }


    if(
        state.pattern ===
        "cherries"
    ){

        pattern.classList.add(
            "cherries"
        );

    }


    if(
        state.pattern ===
        "rainbow"
    ){

        pattern.classList.add(
            "rainbow"
        );

    }


    if(
        state.pattern ===
        "glitter"
    ){

        pattern.classList.add(
            "glitter"
        );

    }


    if(
        state.pattern ===
        "hearts"
    ){

        pattern.classList.add(
            "heartPattern"
        );


        for(
            let i=0;
            i<7;
            i++
        ){

            const heart =
                document.createElement(
                    "span"
                );

            heart.className =
                "miniHeart";

            heart.textContent =
                i%2
                    ? "♥"
                    : "♡";

            heart.style.left =
                (10+i*13)+"%";

            heart.style.top =
                (20+(i%3)*24)+"%";

            heart.style.transform =
                `rotate(${i*17-15}deg)`;

            pattern.appendChild(
                heart
            );

        }

    }


    if(
        state.pattern ===
        "sprinkles"
    ){

        for(
            let i=0;
            i<32;
            i++
        ){

            const sprinkle =
                document.createElement(
                    "i"
                );

            const sprinkleColours = [

                "#ff668c",
                "#65bde1",
                "#ffd052",
                "#72c78d",
                "#a88bda",
                "#ff9b6b"

            ];

            sprinkle.style.cssText = `

                position:absolute;

                width:17px;
                height:5px;

                border-radius:8px;

                left:${Math.random()*92}%;

                top:${Math.random()*88}%;

                background:
                    ${sprinkleColours[
                        i %
                        sprinkleColours.length
                    ]};

                transform:
                    rotate(${Math.random()*180}deg);

            `;

            pattern.appendChild(
                sprinkle
            );

        }

    }


    /* accessory */

    $("accessory")
        .textContent =
            state.accessory;


    /* stickers */

    $("sticker1")
        .textContent =
            state.sticker1 === "None"
                ? ""
                : state.sticker1;

    $("sticker2")
        .textContent =
            state.sticker2 === "None"
                ? ""
                : state.sticker2;


    $("sticker1")
        .style.display =
            state.sticker1 === "None"
                ? "none"
                : "block";


    $("sticker2")
        .style.display =
            state.sticker2 === "None"
                ? "none"
                : "block";


    /* face */

    const face =
        $("face");

    face.style.display =
        state.face === "none"
            ? "none"
            : "flex";

    face.innerHTML = "";


    if(
        state.face !==
        "none"
    ){

        const leftEye =
            document.createElement(
                "div"
            );

        const rightEye =
            document.createElement(
                "div"
            );

        leftEye.className =
            "eye";

        rightEye.className =
            "eye";


        if(
            state.face ===
            "sleepy"
        ){

            leftEye.style.height =
                "5px";

            rightEye.style.height =
                "5px";

            leftEye.style.marginTop =
                "7px";

            rightEye.style.marginTop =
                "7px";

        }


        if(
            state.face ===
            "wink"
        ){

            leftEye.style.height =
                "5px";

            leftEye.style.marginTop =
                "7px";

        }


        if(
            state.face ===
            "surprised"
        ){

            leftEye.style.width =
                "17px";

            rightEye.style.width =
                "17px";

            leftEye.style.height =
                "22px";

            rightEye.style.height =
                "22px";

        }


        if(
            state.face ===
            "cool"
        ){

            leftEye.style.width =
                "25px";

            rightEye.style.width =
                "25px";

            leftEye.style.height =
                "9px";

            rightEye.style.height =
                "9px";

            leftEye.style.borderRadius =
                "4px";

            rightEye.style.borderRadius =
                "4px";

        }


        face.appendChild(
            leftEye
        );

        face.appendChild(
            rightEye
        );


        if(
            state.face !==
            "cool"
        ){

            const blushL =
                document.createElement(
                    "div"
                );

            const blushR =
                document.createElement(
                    "div"
                );

            blushL.className =
                "blush l";

            blushR.className =
                "blush r";

            face.appendChild(
                blushL
            );

            face.appendChild(
                blushR
            );

        }


        const mouth =
            document.createElement(
                "div"
            );

        mouth.className =
            "mouth";

        face.appendChild(
            mouth
        );

    }

}


/* =========================================================
   BUILD COLOURS
========================================================= */

function buildColours(){

    const container =
        $("swatches");

    container.innerHTML = "";

    colours.forEach(
        (colour,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "swatch";

            button.title =
                colour[0];

            button.style.background =
                colour[1];

            if(
                index ===
                state.colour
            ){

                button.classList.add(
                    "selected"
                );

            }

            button.onclick = () => {

                state.colour =
                    index;

                container
                    .querySelectorAll(
                        ".swatch"
                    )
                    .forEach(
                        b =>
                            b.classList.remove(
                                "selected"
                            )
                    );

                button.classList.add(
                    "selected"
                );

                render();

                sparkleSound();

            };

            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   RANDOMISE
========================================================= */

function randomise(){

    state.colour =
        Math.floor(
            Math.random() *
            colours.length
        );


    state.finish =
        finishes[
            Math.floor(
                Math.random() *
                finishes.length
            )
        ][1];


    state.pattern =
        patterns[
            Math.floor(
                Math.random() *
                patterns.length
            )
        ][1];


    state.accessory =
        accessories[
            Math.floor(
                Math.random() *
                accessories.length
            )
        ][1];


    state.sticker1 =
        stickers[
            Math.floor(
                Math.random() *
                stickers.length
            )
        ];


    state.sticker2 =
        stickers[
            Math.floor(
                Math.random() *
                stickers.length
            )
        ];


    state.face =
        faces[
            Math.floor(
                Math.random() *
                faces.length
            )
        ][1];


    buildColours();

    syncButtons();

    render();

    sparkleSound();

    toast(
        "✨ New dumpling!"
    );

}


/* =========================================================
   SYNC BUTTONS
========================================================= */

function syncButtons(){

    const groups = [

        [
            "finishOptions",
            state.finish
        ],

        [
            "patternOptions",
            state.pattern
        ],

        [
            "accessoryOptions",
            state.accessory
        ],

        [
            "faceOptions",
            state.face
        ]

    ];


    groups.forEach(
        group => {

            $(group[0])
                .querySelectorAll(
                    ".option"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "selected",
                            button.dataset.value ===
                            group[1]
                        );

                    }
                );

        }
    );

}


/* =========================================================
   SQUISH
========================================================= */

function squish(){

    const dumpling =
        $("dumpling");

    dumpling.classList.remove(
        "squishing"
    );

    void dumpling.offsetWidth;

    dumpling.classList.add(
        "squishing"
    );


    squishSound();


    const symbols = [

        "💖",
        "✨",
        "⭐",
        "🌸",
        "🍓",
        "🥟",
        "💕",
        "🌈",
        "💗"

    ];


    for(
        let i=0;
        i<22;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );

        piece.className =
            "confettiPiece";

        piece.textContent =
            symbols[
                i %
                symbols.length
            ];


        piece.style.left =
            "50%";

        piece.style.top =
            "48%";


        piece.style.setProperty(
            "--x",
            (
                Math.random()*450-225
            )+"px"
        );


        piece.style.setProperty(
            "--y",
            (
                Math.random()*340-190
            )+"px"
        );


        piece.style.setProperty(
            "--rotation",
            (
                Math.random()*720
            )+"deg"
        );


        document.body.appendChild(
            piece
        );


        setTimeout(
            () =>
                piece.remove(),
            1300
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

    const box =
        $("toast");

    box.textContent =
        message;

    box.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                box.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   SAVE
========================================================= */

function saveDesign(){

    localStorage.setItem(
        "dumplingSquishyDeluxe",
        JSON.stringify(
            state
        )
    );

    toast(
        "💾 Dumpling saved!"
    );

}


/* =========================================================
   RESET
========================================================= */

function resetDesign(){

    Object.assign(
        state,
        {

            colour:0,

            finish:"soft",

            pattern:"plain",

            accessory:"",

            sticker1:"💖",

            sticker2:"🍓",

            face:"happy",

            name:""

        }
    );


    $("nameInput").value =
        "";


    buildColours();

    syncButtons();

    render();

    toast(
        "↺ Fresh dumpling!"
    );

}


/* =========================================================
   NAME
========================================================= */

function setName(){

    state.name =
        $("nameInput")
            .value
            .trim();


    if(
        state.name
    ){

        toast(
            "🥟 Meet " +
            state.name +
            "!"
        );

    }else{

        toast(
            "Give your dumpling a name!"
        );

    }

}


/* =========================================================
   VOLUME
========================================================= */

$("volume").addEventListener(
    "input",
    function(){

        initAudio();

        masterGain.gain.value =
            Number(this.value) / 100;

    }
);


/* =========================================================
   BUTTONS
========================================================= */

$("musicButton").onclick =
    toggleMusic;

$("musicTop").onclick =
    toggleMusic;

$("saveButton").onclick =
    saveDesign;

$("randomTop").onclick =
    randomise;

$("randomButton").onclick =
    randomise;

$("resetButton").onclick =
    resetDesign;

$("squishButton").onclick =
    squish;

$("nameButton").onclick =
    setName;


$("nameInput").addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            setName();

        }

    }
);


/* =========================================================
   LOAD SAVED DESIGN
========================================================= */

const saved =
    localStorage.getItem(
        "dumplingSquishyDeluxe"
    );


if(saved){

    try{

        Object.assign(
            state,
            JSON.parse(saved)
        );

    }catch(error){

        console.log(
            "Saved design could not be loaded."
        );

    }

}


/* =========================================================
   BUILD CONTROLS
========================================================= */

buildColours();


createOptions(
    "finishOptions",
    finishes,
    value =>
        state.finish = value,
    () =>
        state.finish
);


createOptions(
    "patternOptions",
    patterns,
    value =>
        state.pattern = value,
    () =>
        state.pattern
);


createOptions(
    "accessoryOptions",
    accessories,
    value =>
        state.accessory = value,
    () =>
        state.accessory
);


createOptions(
    "stickerOptions",
    stickers,
    value => {

        /*
            Alternate between the two
            sticker positions.
        */

        if(
            state.sticker1 ===
            "None"
        ){

            state.sticker1 =
                value;

        }else{

            state.sticker2 =
                value;

        }

    },
    () =>
        state.sticker1
);


createOptions(
    "faceOptions",
    faces,
    value =>
        state.face = value,
    () =>
        state.face
);


/* =========================================================
   START
========================================================= */

if(state.name){

    $("nameInput").value =
        state.name;

}

render();

</script>

</body>
