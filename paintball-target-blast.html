<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paintball Target Blast</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:'Baloo 2',sans-serif;background:radial-gradient(circle at 15% 10%,#fff36b 0 8%,transparent 25%),radial-gradient(circle at 85% 15%,#ff83bd 0 8%,transparent 27%),linear-gradient(135deg,#74e9ff,#9e8cff 48%,#ff9bd0);min-height:100vh;color:#20203b;overflow-x:hidden}.wrap{max-width:1100px;margin:auto;padding:18px}.top{text-align:center}.top h1{font-size:clamp(40px,7vw,72px);margin:5px 0 0;color:white;text-shadow:0 6px 0 #483b9b,0 10px 20px #41377a66;line-height:.95}.top p{margin:8px 0 15px;color:white;font-size:20px;font-weight:700}.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{background:#ffffffdf;border:3px solid #fff;border-radius:20px;padding:7px 18px;font-size:19px;font-weight:800;box-shadow:0 5px 12px #3333}.game{position:relative;margin:16px auto;background:#b9edff;border:8px solid white;border-radius:30px;box-shadow:0 15px 35px #34256b55;overflow:hidden;cursor:crosshair;max-width:1050px;height:min(67vh,650px);min-height:430px}.range{position:absolute;inset:0;background:linear-gradient(#8bdfff 0 55%,#75cf75 55% 100%)}.range:before{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(170deg,#65bd65 0 8px,#74ce74 8px 16px)}.cloud{position:absolute;width:150px;height:45px;background:white;border-radius:50px;opacity:.75}.cloud:before,.cloud:after{content:'';position:absolute;background:white;border-radius:50%}.cloud:before{width:65px;height:65px;left:25px;bottom:10px}.cloud:after{width:80px;height:80px;right:25px;bottom:5px}.c1{top:55px;left:8%}.c2{top:120px;right:8%;transform:scale(.7)}.target{position:absolute;width:110px;height:110px;border-radius:50%;transform:translate(-50%,-50%);background:repeating-radial-gradient(circle,#fff 0 12px,#ff3d68 12px 25px,#fff 25px 38px,#ff3d68 38px 51px);border:5px solid #22203a;box-shadow:inset 0 0 0 4px #ffffff88,0 8px 15px #2225;transition:transform .12s}.target:after{content:'+';position:absolute;inset:0;display:grid;place-items:center;font-family:Arial;font-weight:900;font-size:34px;color:#22203a55}.target.hit{animation:hit .28s ease}.splat{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5}.splat:before,.splat:after{content:'';position:absolute;width:8px;height:28px;border-radius:50%;background:inherit;left:6px;top:-5px;transform:rotate(25deg)}.splat:after{transform:rotate(-55deg);height:22px;top:4px}.float{position:absolute;font-size:28px;font-weight:900;color:white;text-shadow:0 3px #222;animation:float .7s ease forwards;pointer-events:none;z-index:7}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:18px;padding:12px 22px;font:800 19px 'Baloo 2';cursor:pointer;background:#fff;color:#3d3386;box-shadow:0 5px 0 #5148a4;transition:.12s}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5148a4}.btn.paint{background:#ffdd45}.btn.danger{background:#ff668d;color:white}.message{text-align:center;color:white;font-size:21px;font-weight:800;min-height:30px;text-shadow:0 2px #40376d}.cross{position:absolute;pointer-events:none;width:35px;height:35px;border:4px solid white;border-radius:50%;transform:translate(-50%,-50%);display:none;box-shadow:0 0 0 3px #3338}.cross:before,.cross:after{content:'';position:absolute;background:white}.cross:before{width:4px;height:47px;left:11px;top:-10px}.cross:after{height:4px;width:47px;left:-10px;top:11px}@keyframes hit{50%{transform:translate(-50%,-50%) scale(1.22) rotate(5deg)}100%{transform:translate(-50%,-50%) scale(1)}}@keyframes float{0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-110px) scale(1.2)}}@media(max-width:650px){.game{min-height:420px;height:62vh}.target{width:90px;height:90px}.top p{font-size:17px}.pill{font-size:16px}}
</style></head>
<body><div class="wrap">
<div class="top"><h1>🎨 PAINTBALL BLAST!</h1><p>Hit the targets • splat the paint • beat your high score!</p><div class="bar"><div class="pill">🎯 Score <span id="score">0</span></div><div class="pill">⏱️ Time <span id="time">30</span></div><div class="pill">🔥 Streak <span id="streak">0</span></div><div class="pill">🏆 Best <span id="best">0</span></div></div></div>
<div class="game" id="game"><div class="range"><div class="cloud c1"></div><div class="cloud c2"></div><div class="target" id="target"></div><div class="cross" id="cross"></div></div></div>
<div class="message" id="message">Ready? Start the paintball challenge!</div>
<div class="controls"><button class="btn paint" id="start">🎨 Start Game</button><button class="btn" id="easy">🟢 Chill Mode</button><button class="btn" id="hard">🔥 Crazy Mode</button><button class="btn danger" id="reset">↻ Reset</button></div>
</div>
<script>
const game=document.getElementById('game'),target=document.getElementById('target'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),streakEl=document.getElementById('streak'),bestEl=document.getElementById('best'),msg=document.getElementById('message'),cross=document.getElementById('cross');
let score=0,time=30,streak=0,playing=false,timer=null,targetTimer=null,mode='normal',best=Number(localStorage.paintballBest||0);bestEl.textContent=best;
function place(){let r=game.getBoundingClientRect(),pad=70;let x=pad+Math.random()*(r.width-pad*2),y=90+Math.random()*(r.height-150);target.style.left=x+'px';target.style.top=y+'px';target.style.display='block'}
function start(){clearInterval(timer);clearTimeout(targetTimer);score=0;streak=0;time=mode==='hard'?20:mode==='easy'?45:30;playing=true;update();msg.textContent=mode==='hard'?'🔥 Crazy mode! GO!':'🎯 Find the target and SPLAT it!';place();tick();}
function tick(){timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);clearTimeout(targetTimer);target.style.display='none';if(score>best){best=score;localStorage.paintballBest=best;bestEl.textContent=best;msg.textContent='🏆 NEW HIGH SCORE! '+score+' points!'}else msg.textContent='🎉 Time! You scored '+score+' points!';}
function update(){scoreEl.textContent=score;timeEl.textContent=time;streakEl.textContent=streak;}
function splat(x,y,colour){let s=document.createElement('div');s.className='splat';s.style.left=x+'px';s.style.top=y+'px';s.style.background=colour;game.appendChild(s);setTimeout(()=>s.remove(),900)}
function fire(e){if(!playing)return;let r=game.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,tr=target.getBoundingClientRect(),tx=tr.left-r.left+tr.width/2,ty=tr.top-r.top+tr.height/2,hit=Math.hypot(x-tx,y-ty)<tr.width/2;if(hit){let points=10+Math.min(streak,10)*2;score+=points;streak++;splat(tx,ty,['#ff3b75','#ffd43b','#48d9ff','#7bff65','#9d62ff'][Math.floor(Math.random()*5)]);let f=document.createElement('div');f.className='float';f.textContent='+'+points;f.style.left=tx+'px';f.style.top=ty+'px';game.appendChild(f);setTimeout(()=>f.remove(),700);target.classList.remove('hit');void target.offsetWidth;target.classList.add('hit');place();msg.textContent=streak>=5?'🔥 PAINTBALL STREAK!':'💥 SPLAT! Nice shot!';}else{streak=0;msg.textContent='😜 Missed! Keep aiming!';splat(x,y,'#ff4d8d')}update()}
game.addEventListener('pointerdown',fire);game.addEventListener('pointermove',e=>{let r=game.getBoundingClientRect();cross.style.display='block';cross.style.left=(e.clientX-r.left)+'px';cross.style.top=(e.clientY-r.top)+'px'});game.addEventListener('pointerleave',()=>cross.style.display='none');
document.getElementById('start').onclick=start;document.getElementById('easy').onclick=()=>{mode='easy';start()};document.getElementById('hard').onclick=()=>{mode='hard';start()};document.getElementById('reset').onclick=()=>{clearInterval(timer);playing=false;score=0;streak=0;time=30;update();target.style.display='none';msg.textContent='Ready? Start the paintball challenge!'};
update();
</script></body></html>
