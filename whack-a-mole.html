<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garden Whack-a-Mole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --sky-top:#bfe9ff;
  --sky-bottom:#eef9ff;
  --grass-1:#6fa84a;
  --grass-2:#5b8c3a;
  --grass-3:#3f6b26;
  --dirt-dark:#3b2a1c;
  --dirt-mid:#5c4230;
  --dirt-light:#7a5a3c;
  --wood-light:#b9834f;
  --wood-mid:#8b5e3c;
  --wood-dark:#5e3d24;
  --cream:#fbf1dd;
  --gold:#e8b23d;
  --gold-dark:#b8791f;
  --fur-1:#8a6a48;
  --fur-2:#6b4c30;
  --fur-3:#4a3323;
  --bunny-1:#efe9de;
  --bunny-2:#cfc5b4;
  --bunny-3:#a89a82;
  --danger:#c1443a;
}

*{ box-sizing:border-box; }

html,body{ height:100%; margin:0; }

body{
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
  font-family:'Nunito',system-ui,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

/* ---------- Header / Scoreboard ---------- */

header.hud{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:3vw;
  padding:10px 4vw;
  background:linear-gradient(180deg,var(--wood-light),var(--wood-mid));
  border-bottom:6px solid var(--wood-dark);
  box-shadow:0 4px 10px rgba(0,0,0,.25);
  position:relative;
  z-index:10;
}

.hud-box{ display:flex; flex-direction:column; align-items:center; min-width:56px; }
.hud-box .label{ font-size:.65rem; letter-spacing:.02em; color:var(--cream); opacity:.85; }
.hud-box .value{ font-family:'Baloo 2',sans-serif; font-size:1.35rem; color:var(--cream); text-shadow:0 2px 2px rgba(0,0,0,.3); }

.timer-wrap{ flex:1 1 auto; display:flex; align-items:center; gap:10px; max-width:440px; }
.timer-track{ flex:1 1 auto; height:14px; border-radius:8px; background:rgba(0,0,0,.35); overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.4); }
.timer-fill{ height:100%; width:100%; background:linear-gradient(90deg,#8bd155,#e8c93d 60%,#e0553d 100%); transition:width .15s linear; }
.timer-text{ font-family:'Baloo 2',sans-serif; color:var(--cream); min-width:24px; text-align:center; }

.icon-btn{
  width:38px; height:38px; border-radius:50%; border:none;
  background:var(--wood-dark); color:var(--cream);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 2px 4px rgba(0,0,0,.3);
  flex:0 0 auto;
}
.icon-btn:hover{ filter:brightness(1.15); }

/* ---------- Field ---------- */

main.field{
  flex:1 1 auto;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 38%, var(--grass-1) 40%, var(--grass-2) 70%, var(--grass-3) 100%);
  touch-action:none;
}

body.playing .field{ cursor:none; }

.backdrop{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }

.sun{
  position:absolute; top:6%; right:9%; width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff6d0, #ffd873 55%, #ffbe3d 100%);
  box-shadow:0 0 40px 10px rgba(255,214,110,.5);
}

.cloud{ position:absolute; background:#fff; border-radius:50px; opacity:.85; }
.cloud::before, .cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
.cloud.c1{ top:10%; left:-20%; width:70px; height:24px; animation:drift 46s linear infinite; }
.cloud.c1::before{ width:36px; height:36px; top:-16px; left:8px; }
.cloud.c1::after{ width:26px; height:26px; top:-10px; left:38px; }
.cloud.c2{ top:18%; left:-30%; width:50px; height:18px; animation:drift 64s linear infinite 8s; }
.cloud.c2::before{ width:26px; height:26px; top:-11px; left:6px; }
.cloud.c2::after{ width:20px; height:20px; top:-7px; left:26px; }
.cloud.c3{ top:5%; left:-25%; width:60px; height:20px; animation:drift 56s linear infinite 20s; }
.cloud.c3::before{ width:30px; height:30px; top:-13px; left:8px; }
.cloud.c3::after{ width:22px; height:22px; top:-8px; left:32px; }

@keyframes drift{ from{ transform:translateX(0); } to{ transform:translateX(160vw); } }

.deco{ position:absolute; pointer-events:none; z-index:1; }

.tuft{
  width:20px; height:22px;
  background:
    linear-gradient(75deg, transparent 46%, var(--grass-3) 46% 54%, transparent 54%),
    linear-gradient(105deg, transparent 46%, var(--grass-2) 46% 54%, transparent 54%),
    linear-gradient(90deg, transparent 46%, var(--grass-1) 46% 54%, transparent 54%);
  background-repeat:no-repeat;
}

.flower{
  width:12px; height:12px; border-radius:50%;
  background:radial-gradient(circle,#fff8c4,#f3c53d 70%);
  box-shadow:0 0 0 3px rgba(255,255,255,.75);
}

.lawn{
  position:absolute; inset:37% 0 0 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:1.5vmin;
  padding:2vmin 6vmin 4vmin;
  z-index:2;
}

.hole-wrap{ position:relative; display:flex; align-items:flex-end; justify-content:center; }
.hole-wrap:nth-child(2){ transform:translateY(5%); }
.hole-wrap:nth-child(4){ transform:translateY(-4%); }
.hole-wrap:nth-child(5){ transform:translateY(4%); }
.hole-wrap:nth-child(6){ transform:translateY(-5%); }
.hole-wrap:nth-child(8){ transform:translateY(3%); }

.mound-hole{ position:relative; width:min(100%,190px); aspect-ratio:1/1; margin:0 auto; }

.mound{
  position:absolute; inset:6% 0 -10% 0; border-radius:50%;
  background:radial-gradient(ellipse at 32% 28%, var(--dirt-light) 0%, var(--dirt-mid) 55%, var(--dirt-dark) 100%);
  box-shadow:0 10px 14px rgba(0,0,0,.28), inset 0 -8px 14px rgba(0,0,0,.25);
}
.mound::before, .mound::after{
  content:""; position:absolute; bottom:4%; width:24%; height:32%;
  background:radial-gradient(ellipse at 50% 100%, var(--grass-2), transparent 72%);
}
.mound::before{ left:-6%; transform:rotate(-14deg); }
.mound::after{ right:-6%; transform:rotate(14deg); }

.hole{
  position:absolute; inset:14% 16% 16% 16%; border-radius:50%;
  background:radial-gradient(ellipse at 50% 32%, #2b1c10 0%, #150d07 55%, #000 100%);
  box-shadow:inset 0 12px 18px rgba(0,0,0,.65), inset 0 -4px 8px rgba(0,0,0,.4);
  overflow:hidden; z-index:2;
}

/* ---------- Critter ---------- */

.critter{
  position:absolute; left:50%; bottom:-6%; width:80%; height:120%;
  transform:translate(-50%,105%);
  transition:transform .17s cubic-bezier(.34,1.56,.64,1);
}
.critter.up{ transform:translate(-50%,14%); }

.critter-inner{ position:relative; width:100%; height:100%; transform-origin:50% 85%; }
.critter.up .critter-inner:not(.hit){ animation:bob 1.5s ease-in-out infinite; }
.critter-inner.hit{ animation:squash .35s ease-out forwards; }

@keyframes bob{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
@keyframes squash{
  0%{ transform:scale(1) rotate(0); }
  30%{ transform:scale(1.18,.7) rotate(-9deg); }
  60%{ transform:scale(.88,1.12) rotate(7deg); }
  100%{ transform:scale(.55) rotate(0deg); opacity:.35; }
}

.head{
  position:absolute; left:50%; top:18%; width:78%; height:62%; transform:translateX(-50%);
  border-radius:50% 50% 46% 46%/56% 56% 44% 44%;
  background:
    radial-gradient(ellipse at 38% 30%, var(--fur-1) 0%, var(--fur-2) 55%, var(--fur-3) 100%),
    radial-gradient(circle at 70% 70%, rgba(0,0,0,.12) 0 8%, transparent 9%),
    radial-gradient(circle at 25% 65%, rgba(0,0,0,.1) 0 6%, transparent 7%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.25), 0 3px 4px rgba(0,0,0,.2);
}

.ear{
  position:absolute; top:-8%; width:26%; height:30%; border-radius:50% 50% 40% 40%;
  background:linear-gradient(160deg,var(--fur-1),var(--fur-3));
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.3);
}
.ear::after{ content:""; position:absolute; inset:22% 26%; border-radius:50%; background:#c98a86; opacity:.55; }
.ear.left{ left:2%; transform:rotate(-18deg); }
.ear.right{ right:2%; transform:rotate(18deg); }

.eye{ position:absolute; top:38%; width:16%; height:16%; border-radius:50%; background:#241a12; }
.eye::after{ content:""; position:absolute; top:14%; left:16%; width:34%; height:34%; border-radius:50%; background:#fff; opacity:.85; }
.eye.left{ left:22%; }
.eye.right{ right:22%; }

.snout{
  position:absolute; left:50%; bottom:6%; width:46%; height:34%; transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%, var(--fur-1), var(--fur-2) 80%);
}

.nose{
  position:absolute; left:50%; top:22%; width:30%; height:22%; transform:translateX(-50%);
  border-radius:50% 50% 60% 60%;
  background:radial-gradient(circle at 35% 30%, #f3a6a3, #d3615c 75%);
}

.whisker{ position:absolute; top:56%; width:24%; height:2px; background:rgba(255,255,255,.75); border-radius:2px; }
.whisker.l1{ left:-14%; transform:rotate(-8deg); }
.whisker.l2{ left:-16%; top:64%; transform:rotate(4deg); }
.whisker.r1{ right:-14%; transform:rotate(8deg); }
.whisker.r2{ right:-16%; top:64%; transform:rotate(-4deg); }

.paw{ position:absolute; bottom:-2%; width:22%; height:16%; border-radius:50% 50% 40% 40%; background:linear-gradient(180deg,var(--fur-1),var(--fur-3)); }
.paw.left{ left:8%; }
.paw.right{ right:8%; }

/* Golden mole */
.critter--golden .head{
  background:
    radial-gradient(ellipse at 38% 30%, #ffe9a8 0%, var(--gold) 55%, var(--gold-dark) 100%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.2), 0 0 18px 4px rgba(232,178,61,.65);
}
.critter--golden .ear{ background:linear-gradient(160deg,#ffe9a8,var(--gold-dark)); }
.critter--golden .snout{ background:radial-gradient(ellipse at 50% 30%, #ffe9a8, var(--gold) 80%); }
.critter--golden .paw{ background:linear-gradient(180deg,#ffe9a8,var(--gold-dark)); }

/* Bunny */
.critter--bunny .head{
  background:
    radial-gradient(ellipse at 38% 30%, var(--bunny-1) 0%, var(--bunny-2) 55%, var(--bunny-3) 100%),
    radial-gradient(circle at 70% 70%, rgba(0,0,0,.08) 0 8%, transparent 9%);
}
.critter--bunny .ear{
  height:70%; width:16%; top:-58%; border-radius:50% 50% 40% 40%;
  background:linear-gradient(180deg,var(--bunny-1),var(--bunny-3));
}
.critter--bunny .ear::after{ background:#e2a3ac; }
.critter--bunny .ear.left{ left:14%; transform:rotate(-8deg); }
.critter--bunny .ear.right{ right:14%; transform:rotate(8deg); }
.critter--bunny .snout{ background:radial-gradient(ellipse at 50% 30%, var(--bunny-1), var(--bunny-2) 80%); }
.critter--bunny .paw{ background:linear-gradient(180deg,var(--bunny-1),var(--bunny-3)); }

/* ---------- Mallet cursor ---------- */

#mallet{
  position:fixed; top:0; left:0; width:70px; height:90px;
  pointer-events:none; z-index:80; opacity:0; transition:opacity .15s;
}
body.playing #mallet{ opacity:1; }

.mallet-rotor{ position:relative; width:100%; height:100%; transform-origin:18% 88%; transform:rotate(-22deg); }
.mallet-rotor.swing{ animation:swingAnim .22s ease-out; }
@keyframes swingAnim{ 0%{ transform:rotate(-22deg); } 45%{ transform:rotate(42deg); } 100%{ transform:rotate(-22deg); } }

.mallet-handle{ position:absolute; left:26%; top:34%; width:14%; height:64%; border-radius:6px; background:linear-gradient(90deg,#a9754a,#7a5030); }
.mallet-head{ position:absolute; left:2%; top:0; width:70%; height:38%; border-radius:14px; background:linear-gradient(160deg,#c48a52,#8b5e3c); box-shadow:0 4px 6px rgba(0,0,0,.35), inset 0 -4px 6px rgba(0,0,0,.25); }

/* ---------- Feedback effects ---------- */

.float-score{
  position:absolute; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.3rem;
  pointer-events:none; transform:translate(-50%,-50%); z-index:30;
  text-shadow:0 2px 3px rgba(0,0,0,.25);
  animation:scoreFloat .7s ease-out forwards;
}
@keyframes scoreFloat{ to{ transform:translate(-50%,-160%); opacity:0; } }

.dirt-speck{
  position:absolute; width:7px; height:7px; border-radius:2px; background:var(--dirt-mid);
  pointer-events:none; z-index:25;
  animation:puffOut .4s ease-out forwards;
}
@keyframes puffOut{ to{ transform:translate(var(--dx),var(--dy)) rotate(60deg); opacity:0; } }

.flash-text{
  position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) scale(.6);
  font-family:'Baloo 2',sans-serif; font-size:2.4rem; color:#fff;
  text-shadow:0 3px 6px rgba(0,0,0,.35), 0 0 20px rgba(255,255,255,.4);
  pointer-events:none; z-index:40;
  animation:flashPop .7s ease-out forwards;
}
@keyframes flashPop{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(.5); }
  20%{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
  70%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-60%) scale(1); }
}

/* ---------- Overlays ---------- */

.overlay{ position:fixed; inset:0; background:rgba(20,14,8,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.overlay.hidden{ display:none; }

.card{
  background:linear-gradient(180deg,var(--wood-light),var(--wood-mid));
  border:6px solid var(--wood-dark); border-radius:18px;
  padding:32px 28px; max-width:min(92vw,420px); text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.card h1, .card h2{ font-family:'Baloo 2',sans-serif; color:var(--cream); margin:0 0 10px; font-size:1.8rem; text-shadow:0 2px 3px rgba(0,0,0,.3); }
.card p{ color:var(--cream); opacity:.9; margin:0 0 22px; line-height:1.5; }

.stat-row{ display:flex; justify-content:center; gap:30px; margin-bottom:22px; }
.stat-row .stat{ display:flex; flex-direction:column; align-items:center; }
.stat-row .stat .label{ font-size:.75rem; color:var(--cream); opacity:.8; }
.stat-row .stat .value{ font-family:'Baloo 2',sans-serif; font-size:1.8rem; color:var(--cream); }

.badge{ display:inline-block; margin-bottom:14px; padding:4px 12px; border-radius:20px; background:var(--gold); color:#4a3323; font-family:'Baloo 2',sans-serif; font-size:.85rem; }

.btn{
  font-family:'Baloo 2',sans-serif; font-size:1.1rem; padding:12px 30px; border:none; border-radius:12px;
  background:var(--gold); color:#4a3323; cursor:pointer;
  box-shadow:0 4px 0 var(--gold-dark), 0 6px 10px rgba(0,0,0,.3);
  transition:transform .08s;
}
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--gold-dark), 0 2px 4px rgba(0,0,0,.3); }

.hidden{ display:none !important; }
</style>
</head>

</main>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h1>🌼 Garden Whack-a-Mole</h1>
    <p>Whack the moles for points, grab the golden mole for a big bonus &mdash; but leave the bunnies alone!</p>
    <button class="btn" id="playBtn">Start Game</button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="card">
    <h2>Time's Up!</h2>
    <span class="badge hidden" id="newBestBadge">New Best!</span>
    <div class="stat-row">
      <div class="stat"><span class="label">Score</span><span class="value" id="finalScoreEl">0</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="finalBestEl">0</span></div>
    </div>
    <button class="btn" id="againBtn">Play Again</button>
  </div>
</div>

<script>
(function(){

var ICON_ON = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var ICON_OFF = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

var field = document.getElementById('field');
var mallet = document.getElementById('mallet');
var malletRotor = mallet.querySelector('.mallet-rotor');
var scoreEl = document.getElementById('scoreEl');
var bestEl = document.getElementById('bestEl');
var timerFill = document.getElementById('timerFill');
var timerText = document.getElementById('timerText');
var soundBtn = document.getElementById('soundBtn');
var startOverlay = document.getElementById('startOverlay');
var endOverlay = document.getElementById('endOverlay');
var playBtn = document.getElementById('playBtn');
var againBtn = document.getElementById('againBtn');
var finalScoreEl = document.getElementById('finalScoreEl');
var finalBestEl = document.getElementById('finalBestEl');
var newBestBadge = document.getElementById('newBestBadge');

soundBtn.innerHTML = ICON_ON;

var ROUND_MS = 45000;
var START_SPAWN = 1000, END_SPAWN = 550;
var START_VISIBLE = 1350, END_VISIBLE = 750;
var START_MAX = 1, END_MAX = 2;

var audioCtx = null;
var soundOn = true;

var score = 0, best = 0, streak = 0;
var state = 'idle';
var startTime = 0;
var countdownId = null;
var spawnTimeoutId = null;

var holes = [];

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function lerp(a, b, t){ t = Math.min(1, Math.max(0, t)); return a + (b - a) * t; }

function buildHoles(){
  var wraps = field.querySelectorAll('.hole-wrap');
  wraps.forEach(function(wrap){
    var critterEl = wrap.querySelector('.critter');
    var innerEl = wrap.querySelector('.critter-inner');
    holes.push({
      wrap: wrap,
      critterEl: critterEl,
      innerEl: innerEl,
      timerId: null,
      cleanupId: null,
      state: 'empty',
      type: null
    });
  });
}
buildHoles();

/* ---------- Audio ---------- */

function ensureAudio(){
  if(!audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){
      audioCtx = null;
    }
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function tone(freq, dur, type, gainVal, freqTo){
  if(!soundOn || !audioCtx) return;
  var t0 = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(freqTo){
    osc.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
  }
  gain.gain.setValueAtTime(gainVal, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function popSound(){ tone(200, 0.09, 'sine', 0.12, 280); }
function hitSound(golden){
  if(golden){ tone(520, 0.12, 'square', 0.15, 780); }
  else{ tone(140, 0.1, 'square', 0.18, 90); }
}
function badSound(){ tone(260, 0.22, 'sawtooth', 0.15, 120); }

/* ---------- Mallet cursor ---------- */

function onPointerMove(e){
  mallet.style.transform = 'translate(' + (e.clientX - 10) + 'px, ' + (e.clientY - 72) + 'px)';
}

function swingMallet(){
  malletRotor.classList.remove('swing');
  void malletRotor.offsetWidth;
  malletRotor.classList.add('swing');
}

field.addEventListener('pointermove', onPointerMove);
field.addEventListener('contextmenu', function(e){ e.preventDefault(); });

field.addEventListener('pointerdown', function(e){
  if(state !== 'playing') return;
  swingMallet();
  var critterEl = e.target.closest ? e.target.closest('.critter.up') : null;
  if(!critterEl) return;
  var hole = null;
  for(var i = 0; i < holes.length; i++){
    if(holes[i].critterEl === critterEl){ hole = holes[i]; break; }
  }
  if(!hole || hole.state !== 'up') return;
  onHit(hole, e.clientX, e.clientY);
});

/* ---------- Effects ---------- */

function fieldPoint(clientX, clientY){
  var rect = field.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function spawnFloatText(label, clientX, clientY, color){
  var p = fieldPoint(clientX, clientY);
  var el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = label;
  el.style.left = p.x + 'px';
  el.style.top = p.y + 'px';
  el.style.color = color;
  field.appendChild(el);
  setTimeout(function(){ el.remove(); }, 700);
}

function spawnDirtPuff(clientX, clientY){
  var p = fieldPoint(clientX, clientY);
  var count = 6;
  for(var i = 0; i < count; i++){
    var angle = (Math.PI * 2 / count) * i + rand(-0.2, 0.2);
    var dist = rand(24, 48);
    var speck = document.createElement('div');
    speck.className = 'dirt-speck';
    speck.style.left = p.x + 'px';
    speck.style.top = p.y + 'px';
    speck.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    speck.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    field.appendChild(speck);
    (function(el){ setTimeout(function(){ el.remove(); }, 400); })(speck);
  }
}

function showFlash(text){
  var el = document.createElement('div');
  el.className = 'flash-text';
  el.textContent = text;
  field.appendChild(el);
  setTimeout(function(){ el.remove(); }, 700);
}

function checkStreakFlash(){
  var milestones = [5, 10, 15, 20, 25];
  var messages = ['Nice!', 'Great!', 'Awesome!', 'Fantastic!', 'Incredible!'];
  var idx = milestones.indexOf(streak);
  if(idx !== -1){ showFlash(messages[idx] || 'Amazing!'); }
}

/* ---------- Game logic ---------- */

function updateScoreUI(){
  scoreEl.textContent = score;
  bestEl.textContent = Math.max(best, score);
}

function beginRetract(hole, wasHit){
  hole.state = 'retracting';
  hole.critterEl.classList.remove('up');
  var delay = wasHit ? 200 : 180;
  hole.cleanupId = setTimeout(function(){
    hole.critterEl.className = 'critter';
    hole.innerEl.className = 'critter-inner';
    hole.state = 'empty';
    hole.type = null;
  }, delay);
}

function onHit(hole, clientX, clientY){
  clearTimeout(hole.timerId);
  var type = hole.type;
  hole.innerEl.classList.add('hit');

  var pts = 0, label = '', color = '';

  if(type === 'mole'){
    pts = 10; streak++; label = '+10'; color = '#eafbe0';
    hitSound(false);
  }else if(type === 'golden'){
    pts = 30; streak++; label = '+30'; color = '#fff3c4';
    hitSound(true);
  }else if(type === 'bunny'){
    pts = -15; streak = 0; label = '-15'; color = '#ffd7d2';
    badSound();
  }

  score = Math.max(0, score + pts);
  updateScoreUI();
  spawnFloatText(label, clientX, clientY, color);
  if(type !== 'bunny'){ spawnDirtPuff(clientX, clientY); }
  checkStreakFlash();

  setTimeout(function(){ beginRetract(hole, true); }, 260);
}

function trySpawn(t){
  var maxUp = Math.round(lerp(START_MAX, END_MAX, t));
  var upCount = holes.filter(function(h){ return h.state === 'up'; }).length;
  if(upCount >= maxUp) return;

  var emptyHoles = holes.filter(function(h){ return h.state === 'empty'; });
  if(!emptyHoles.length) return;

  var hole = pick(emptyHoles);
  var roll = Math.random();
  var type = 'mole';
  if(roll < 0.12) type = 'golden';
  else if(roll < 0.30) type = 'bunny';

  var duration = lerp(START_VISIBLE, END_VISIBLE, t);
  if(type === 'golden') duration *= 0.7;

  spawnCritter(hole, type, duration);
}

function spawnCritter(hole, type, duration){
  hole.state = 'up';
  hole.type = type;
  hole.critterEl.className = 'critter up critter--' + type;
  hole.innerEl.className = 'critter-inner';
  popSound();

  hole.timerId = setTimeout(function(){
    if(hole.state === 'up'){
      if(type !== 'bunny'){ streak = 0; }
      beginRetract(hole, false);
    }
  }, duration);
}

function scheduleNext(first){
  if(state !== 'playing') return;
  var elapsed = performance.now() - startTime;
  var t = elapsed / ROUND_MS;
  var delay = first ? 400 : lerp(START_SPAWN, END_SPAWN, t);
  spawnTimeoutId = setTimeout(function(){
    trySpawn(Math.min(1, (performance.now() - startTime) / ROUND_MS));
    scheduleNext(false);
  }, delay);
}

function updateTimer(){
  var elapsed = performance.now() - startTime;
  var remain = Math.max(0, ROUND_MS - elapsed);
  timerFill.style.width = (remain / ROUND_MS * 100) + '%';
  timerText.textContent = Math.ceil(remain / 1000);
  if(remain <= 0){ endRound(); }
}

function resetHoles(){
  holes.forEach(function(h){
    clearTimeout(h.timerId);
    clearTimeout(h.cleanupId);
    h.critterEl.className = 'critter';
    h.innerEl.className = 'critter-inner';
    h.state = 'empty';
    h.type = null;
  });
}

function forceRetractAll(){
  holes.forEach(function(h){
    clearTimeout(h.timerId);
    clearTimeout(h.cleanupId);
    h.critterEl.classList.remove('up');
    h.state = 'empty';
  });
}

function startGame(){
  ensureAudio();
  resetHoles();
  score = 0;
  streak = 0;
  updateScoreUI();
  timerFill.style.width = '100%';
  timerText.textContent = Math.ceil(ROUND_MS / 1000);
  startOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  document.body.classList.add('playing');
  state = 'playing';
  startTime = performance.now();
  countdownId = setInterval(updateTimer, 100);
  scheduleNext(true);
}

function endRound(){
  state = 'over';
  clearInterval(countdownId);
  clearTimeout(spawnTimeoutId);
  document.body.classList.remove('playing');
  forceRetractAll();

  var prevBest = best;
  best = Math.max(best, score);
  finalScoreEl.textContent = score;
  finalBestEl.textContent = best;
  bestEl.textContent = best;

  if(score > prevBest && score > 0){
    newBestBadge.classList.remove('hidden');
  }else{
    newBestBadge.classList.add('hidden');
  }

  endOverlay.classList.remove('hidden');
}

playBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', startGame);

soundBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  soundBtn.innerHTML = soundOn ? ICON_ON : ICON_OFF;
});

})();
</script>

</body>
</html>
