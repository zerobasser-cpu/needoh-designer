<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Kinetic Sand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chrome-dark:#3D3226;
    --chrome-cream:#F5EFE3;
    --accent:#D9B366;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    overscroll-behavior:none;
    font-family:'Quicksand', system-ui, sans-serif;
    background:#E7CBA0;
  }
  #sand{
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
  }
  #vignette{
    position:fixed; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.16) 100%);
  }
  #hint{
    position:fixed;
    top:40%; left:50%;
    transform:translate(-50%,-50%);
    color:rgba(61,50,38,0.55);
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    text-align:center;
    line-height:1.7;
    pointer-events:none;
    transition:opacity 0.8s ease;
    text-shadow:0 1px 0 rgba(255,255,255,0.3);
  }
  #hint.hidden{ opacity:0; }

  #toolbar{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    max-width:calc(100% - 20px);
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
    background:rgba(61,50,38,0.7);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:999px;
    box-shadow:0 8px 24px rgba(30,22,10,0.35);
    overflow-x:auto;
    scrollbar-width:none;
    z-index:20;
  }
  #toolbar::-webkit-scrollbar{ display:none; }

  .group{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .divider{ width:1px; height:22px; background:rgba(255,255,255,0.15); flex:0 0 auto; }

  button.tool, button.icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    transition:background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  button.tool svg, button.icon-btn svg{
    width:18px; height:18px;
    stroke:var(--chrome-cream);
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  #menuBtn svg circle{ fill:var(--chrome-cream); stroke:none; }
  button.tool.active, button.icon-btn.active{ background:var(--accent); }
  button.tool.active svg, button.icon-btn.active svg{ stroke:var(--chrome-dark); }
  #menuBtn.active svg circle{ fill:var(--chrome-dark); }
  button.tool:active, button.icon-btn:active{ transform:scale(0.9); }
  button.icon-btn:disabled{ opacity:0.3; pointer-events:none; }

  .swatch{
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    flex:0 0 auto;
    padding:0;
  }
  .swatch.active{ border-color:var(--chrome-dark); box-shadow:0 0 0 2px var(--chrome-cream); }

  #sizeWrap{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  input[type="range"]{
    -webkit-appearance:none;
    width:56px; height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.25);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid var(--chrome-dark);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid var(--chrome-dark);
  }

  #sheetOverlay{
    position:fixed; inset:0;
    background:rgba(20,15,8,0.4);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:29;
  }
  #sheetOverlay.open{ opacity:1; pointer-events:auto; }

  #sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--chrome-dark);
    border-radius:22px 22px 0 0;
    padding:16px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform 0.3s cubic-bezier(.2,.8,.3,1);
    z-index:30;
    box-shadow:0 -10px 30px rgba(0,0,0,0.3);
  }
  #sheet.open{ transform:translateY(0); }

  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .sheet-header span{
    color:var(--chrome-cream);
    font-weight:700;
    font-size:15px;
  }
  .sheet-section{ margin-bottom:16px; }
  .sheet-section:last-child{ margin-bottom:0; }
  .sheet-label{
    color:rgba(245,239,227,0.55);
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
  }
  .sheet-section .group{ gap:10px; flex-wrap:wrap; }
  .sheet-section .swatch{ width:30px; height:30px; }
  .sheet-section button.tool, .sheet-section button.icon-btn{ width:42px; height:42px; background:rgba(255,255,255,0.06); }
  .sheet-section button.tool svg, .sheet-section button.icon-btn svg{ width:20px; height:20px; }
</style>
</head>
<body>

<canvas id="sand"></canvas>
<div id="vignette"></div>
<div id="hint">drag to rake, or pick a tool below<br>tap the dots for colors, stamps and more</div>

<div id="toolbar">
  <div class="group" id="tools">
    <button class="tool active" data-tool="rake5" title="Wide rake" aria-label="Wide rake">
      <svg viewBox="0 0 24 24"><path d="M4 5c2 4 2 10 0 14"/><path d="M10 5c2 4 2 10 0 14"/><path d="M16 5c2 4 2 10 0 14"/><path d="M20 5c2 4 2 10 0 14" opacity="0.5"/></svg>
    </button>
    <button class="tool" data-tool="rake3" title="Narrow rake" aria-label="Narrow rake">
      <svg viewBox="0 0 24 24"><path d="M7 5c2 4 2 10 0 14"/><path d="M12 5c2 4 2 10 0 14"/><path d="M17 5c2 4 2 10 0 14"/></svg>
    </button>
    <button class="tool" data-tool="single" title="Single line" aria-label="Single line">
      <svg viewBox="0 0 24 24"><path d="M12 4c3 5 3 11 0 16"/></svg>
    </button>
    <button class="tool" data-tool="stamp" title="Stamp" aria-label="Stamp">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.1 5.6.5-4.2 3.8 1.2 5.5L12 15l-4.9 2.9 1.2-5.5-4.2-3.8 5.6-.5z"/></svg>
    </button>
    <button class="tool" data-tool="smooth" title="Smooth" aria-label="Smooth">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
    </button>
  </div>

  <div class="divider"></div>

  <button class="icon-btn" id="mirrorBtn" title="Mirror mode" aria-label="Mirror mode">
    <svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M4 8l4 4-4 4"/><path d="M20 8l-4 4 4 4"/></svg>
  </button>

  <div class="divider"></div>

  <div id="sizeWrap">
    <input type="range" id="sizeSlider" min="0.6" max="2" step="0.1" value="1" aria-label="Tool size" />
  </div>

  <div class="divider"></div>

  <button class="icon-btn" id="undoBtn" title="Undo" aria-label="Undo" disabled>
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a7 7 0 0 1 0 14h-3"/></svg>
  </button>

  <div class="divider"></div>

  <button class="icon-btn" id="menuBtn" title="More options" aria-label="More options">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
  </button>
</div>

<div id="sheetOverlay"></div>
<div id="sheet">
  <div class="sheet-header">
    <span>Sand toy settings</span>
    <button class="icon-btn" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="sheet-section">
    <div class="sheet-label">Sand color</div>
    <div class="group" id="swatches">
      <button class="swatch active" data-theme="desert" style="background:#D9B98A" aria-label="Desert sand"></button>
      <button class="swatch" data-theme="moonstone" style="background:#C7C5C0" aria-label="Moonstone sand"></button>
      <button class="swatch" data-theme="coral" style="background:#E8B9AE" aria-label="Coral sand"></button>
      <button class="swatch" data-theme="obsidian" style="background:#3A3A3E" aria-label="Obsidian sand"></button>
    </div>
  </div>

  <div class="sheet-section">
    <div class="sheet-label">Stamp shape</div>
    <div class="group" id="stampShapes">
      <button class="tool active" data-shape="ripple" title="Ripple" aria-label="Ripple stamp">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button class="tool" data-shape="shell" title="Spiral shell" aria-label="Spiral shell stamp">
        <svg viewBox="0 0 24 24"><path d="M12 12c0-2.2 1.8-4 4-4s3.5 1.6 3.5 3.5-1.4 3-3 3-2.5-1.1-2.5-2.3 1-2 2-2"/><path d="M12 12c0 3.9-3.1 7-7 7"/></svg>
      </button>
      <button class="tool" data-shape="star" title="Star" aria-label="Star stamp">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.1 5.6.5-4.2 3.8 1.2 5.5L12 15l-4.9 2.9 1.2-5.5-4.2-3.8 5.6-.5z"/></svg>
      </button>
      <button class="tool" data-shape="heart" title="Heart" aria-label="Heart stamp">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.2-9.3-8.3C.9 8 3.3 4.3 7 4.3c2 0 3.4 1 5 2.9 1.6-1.9 3-2.9 5-2.9 3.7 0 6.1 3.7 4.3 7.4C19 15.8 12 20 12 20z"/></svg>
      </button>
    </div>
  </div>

  <div class="sheet-section">
    <div class="sheet-label">More</div>
    <div class="group" id="actions">
      <button class="icon-btn" id="saveBtn" title="Save image" aria-label="Save image">
        <svg viewBox="0 0 24 24"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>
      </button>
      <button class="icon-btn" id="resetBtn" title="Fresh sand" aria-label="Fresh sand">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" title="Mute sound" aria-label="Mute sound">
        <svg viewBox="0 0 24 24" id="soundIcon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M18.5 6.5a9 9 0 0 1 0 11"/></svg>
      </button>
      <button class="icon-btn active" id="hapticBtn" title="Haptics" aria-label="Haptics">
        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 9v6"/><path d="M21 9v6"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('sand');
  const ctx = canvas.getContext('2d', { alpha:false });
  const hint = document.getElementById('hint');
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  const THEMES = {
    desert:    { base:'#D9B98A', dark:'#8C6B3F', light:'#F5E3C0' },
    moonstone: { base:'#C7C5C0', dark:'#6E6C68', light:'#EFEEEA' },
    coral:     { base:'#E8B9AE', dark:'#A9695C', light:'#FBE3DC' },
    obsidian:  { base:'#3A3A3E', dark:'#151517', light:'#6E6E73' }
  };
  let themeKey = 'desert';
  let theme = THEMES[themeKey];

  let pristine = document.createElement('canvas');
  let pristineCtx = pristine.getContext('2d');

  let tool = 'rake5';
  let stampShape = 'ripple';
  let sizeMult = 1;
  let mirrorMode = false;
  let hapticsOn = ('vibrate' in navigator);
  let muted = false;
  let drawing = false;
  let lastX = 0, lastY = 0;
  let lastStampX = null, lastStampY = null;
  let lastHapticAt = 0;

  let undoStack = [];
  const UNDO_LIMIT = 12;

  function hexToRgba(hex, a){
    const v = hex.replace('#','');
    const r = parseInt(v.substring(0,2),16);
    const g = parseInt(v.substring(2,4),16);
    const b = parseInt(v.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function sizeCanvases(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    pristine.width = w * dpr; pristine.height = h * dpr;
  }

  function paintPristine(){
    const w = pristine.width, h = pristine.height;
    pristineCtx.fillStyle = theme.base;
    pristineCtx.fillRect(0,0,w,h);
    const dotCount = Math.min(26000, Math.floor((w*h)/900));
    for(let i=0;i<dotCount;i++){
      const x = Math.random()*w, y = Math.random()*h;
      const r = 0.5 + Math.random()*1.6;
      const shade = Math.random() < 0.5 ? theme.dark : theme.light;
      const a = 0.04 + Math.random()*0.10;
      pristineCtx.fillStyle = hexToRgba(shade, a);
      pristineCtx.beginPath();
      pristineCtx.arc(x, y, r, 0, Math.PI*2);
      pristineCtx.fill();
    }
  }

  function resetSand(){
    paintPristine();
    ctx.drawImage(pristine, 0, 0);
    undoStack = [];
    updateUndoBtn();
  }

  function initAll(){
    sizeCanvases();
    resetSand();
  }

  window.addEventListener('resize', debounce(initAll, 200));
  function debounce(fn, ms){
    let t;
    return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * dpr;
    const y = (e.clientY - rect.top) * dpr;
    return { x, y };
  }

  // ---- Undo ----
  function pushUndo(){
    try{
      undoStack.push(canvas.toDataURL('image/png'));
      if(undoStack.length > UNDO_LIMIT) undoStack.shift();
      updateUndoBtn();
    }catch(err){}
  }
  function updateUndoBtn(){
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
  }
  function undo(){
    if(undoStack.length === 0) return;
    const dataURL = undoStack.pop();
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0); };
    img.src = dataURL;
    updateUndoBtn();
  }

  // ---- Generalized carved-line renderer ----
  function embossPath(points, closed, width){
    function tracePath(dx,dy){
      ctx.beginPath();
      points.forEach((p,i)=>{
        const x=p.x+dx, y=p.y+dy;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      if(closed) ctx.closePath();
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    tracePath(1.4*dpr, 1.4*dpr);
    ctx.strokeStyle = hexToRgba(theme.dark, 0.30);
    ctx.lineWidth = (width+2) * dpr;
    ctx.stroke();

    tracePath(-1.2*dpr, -1.2*dpr);
    ctx.strokeStyle = hexToRgba(theme.light, 0.40);
    ctx.lineWidth = width * dpr;
    ctx.stroke();

    tracePath(0,0);
    ctx.strokeStyle = hexToRgba(theme.dark, 0.5);
    ctx.lineWidth = Math.max(1, width-2) * dpr;
    ctx.stroke();
  }

  function strokeGroove(x0,y0,x1,y1,width){
    embossPath([{x:x0,y:y0},{x:x1,y:y1}], false, width);
  }

  function smoothPatchAt(x, y){
    const r = 26 * sizeMult * dpr;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(pristine, 0, 0);
    ctx.restore();
  }
  function smoothPatch(x,y){
    smoothPatchAt(x,y);
    if(mirrorMode){
      const mx = canvas.width - x;
      if(Math.abs(mx-x) > 4*dpr) smoothPatchAt(mx,y);
    }
  }

  const TOOL_CONFIG = {
    rake5:  { tines:5, spacing:13, width:6 },
    rake3:  { tines:3, spacing:19, width:7 },
    single: { tines:1, spacing:0,  width:9 },
  };

  function rakeAt(x0,y0,x1,y1){
    const dx = x1-x0, dy = y1-y0;
    const dist = Math.hypot(dx,dy);
    if(dist < 0.5) return;
    const nx = -dy/dist, ny = dx/dist;
    const cfg = TOOL_CONFIG[tool];
    const spacing = cfg.spacing * sizeMult * dpr;
    const width = cfg.width * sizeMult;
    for(let i=0;i<cfg.tines;i++){
      const offset = (i - (cfg.tines-1)/2) * spacing;
      strokeGroove(
        x0 + nx*offset, y0 + ny*offset,
        x1 + nx*offset, y1 + ny*offset,
        width
      );
    }
  }

  function handleStroke(x0,y0,x1,y1){
    if(tool === 'smooth'){ smoothPatch(x1,y1); return; }
    rakeAt(x0,y0,x1,y1);
    if(mirrorMode){
      rakeAt(canvas.width-x0, y0, canvas.width-x1, y1);
    }
  }

  // ---- Stamp shapes ----
  function getStarPoints(cx,cy,scale){
    const pts = [];
    const outerR = 13*scale, innerR = 5.5*scale;
    for(let i=0;i<10;i++){
      const r = i%2===0 ? outerR : innerR;
      const angle = (Math.PI/5)*i - Math.PI/2;
      pts.push({x: cx+Math.cos(angle)*r, y: cy+Math.sin(angle)*r});
    }
    return pts;
  }
  function getHeartPoints(cx,cy,scale){
    const pts = [];
    const s = 0.95*scale;
    for(let i=0;i<=40;i++){
      const t = (i/40)*Math.PI*2;
      const x = 16*Math.pow(Math.sin(t),3);
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      pts.push({x: cx+x*s, y: cy+y*s});
    }
    return pts;
  }
  function getSpiralPoints(cx,cy,scale){
    const pts = [];
    const turns = 2.1, maxAngle = turns*Math.PI*2, growth = 2.4*scale;
    for(let i=0;i<=60;i++){
      const t = (i/60)*maxAngle;
      const r = growth*t/Math.PI;
      pts.push({x: cx+Math.cos(t)*r, y: cy+Math.sin(t)*r});
    }
    return pts;
  }
  function getRippleRings(cx,cy,scale){
    return [6,11,16].map(r=>{
      const pts = [];
      for(let i=0;i<=32;i++){
        const t = (i/32)*Math.PI*2;
        pts.push({x: cx+Math.cos(t)*r*scale, y: cy+Math.sin(t)*r*scale});
      }
      return pts;
    });
  }

  function placeStampAt(x,y){
    const scale = sizeMult * dpr * 1.3;
    const width = 3.5 * sizeMult;
    if(stampShape === 'star') embossPath(getStarPoints(x,y,scale), true, width);
    else if(stampShape === 'heart') embossPath(getHeartPoints(x,y,scale), true, width);
    else if(stampShape === 'shell') embossPath(getSpiralPoints(x,y,scale), false, width);
    else if(stampShape === 'ripple'){
      getRippleRings(x,y,scale).forEach((ring,i)=> embossPath(ring, true, Math.max(1.5, width*(1-i*0.2))));
    }
  }
  function placeStamp(x,y){
    placeStampAt(x,y);
    if(mirrorMode){
      const mx = canvas.width - x;
      if(Math.abs(mx-x) > 4*dpr) placeStampAt(mx,y);
    }
  }

  function hideHint(){ hint.classList.add('hidden'); }
  setTimeout(hideHint, 5500);

  function haptic(ms){
    if(!hapticsOn || !('vibrate' in navigator)) return;
    const now = Date.now();
    if(now - lastHapticAt < 45) return;
    lastHapticAt = now;
    navigator.vibrate(ms);
  }

  const STAMP_TRAIL_SPACING = 55;

  canvas.addEventListener('pointerdown', (e)=>{
    drawing = true;
    const p = getPos(e);
    pushUndo();
    if(tool === 'stamp'){
      placeStamp(p.x, p.y);
      lastStampX = p.x; lastStampY = p.y;
      haptic(18);
    }else{
      lastX = p.x; lastY = p.y;
      handleStroke(p.x, p.y, p.x, p.y);
      startSound();
      haptic(6);
    }
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    hideHint();
  });

  canvas.addEventListener('pointermove', (e)=>{
    if(!drawing) return;
    const p = getPos(e);
    if(tool === 'stamp'){
      const dist = Math.hypot(p.x-lastStampX, p.y-lastStampY);
      if(dist > STAMP_TRAIL_SPACING*dpr){
        placeStamp(p.x, p.y);
        lastStampX = p.x; lastStampY = p.y;
        haptic(10);
      }
    }else{
      handleStroke(lastX, lastY, p.x, p.y);
      updateSound(lastX, lastY, p.x, p.y);
      haptic(4);
      lastX = p.x; lastY = p.y;
    }
  });

  function endStroke(){ drawing = false; stopSound(); }
  window.addEventListener('pointerup', endStroke);
  window.addEventListener('pointercancel', endStroke);
  window.addEventListener('pointerleave', endStroke);

  // ---- Toolbar wiring ----
  document.getElementById('tools').addEventListener('click', (e)=>{
    const btn = e.target.closest('button.tool');
    if(!btn) return;
    document.querySelectorAll('#tools .tool').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
  });

  document.getElementById('swatches').addEventListener('click', (e)=>{
    const btn = e.target.closest('button.swatch');
    if(!btn) return;
    document.querySelectorAll('#swatches .swatch').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    themeKey = btn.dataset.theme;
    theme = THEMES[themeKey];
    resetSand();
  });

  document.getElementById('stampShapes').addEventListener('click', (e)=>{
    const btn = e.target.closest('button.tool');
    if(!btn) return;
    document.querySelectorAll('#stampShapes .tool').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    stampShape = btn.dataset.shape;
  });

  document.getElementById('sizeSlider').addEventListener('input', (e)=>{
    sizeMult = parseFloat(e.target.value);
  });

  document.getElementById('mirrorBtn').addEventListener('click', (e)=>{
    mirrorMode = !mirrorMode;
    e.currentTarget.classList.toggle('active', mirrorMode);
  });

  document.getElementById('undoBtn').addEventListener('click', undo);

  document.getElementById('resetBtn').addEventListener('click', resetSand);

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    try{
      const link = document.createElement('a');
      link.download = 'kinetic-sand.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(err){}
  });

  document.getElementById('hapticBtn').addEventListener('click', (e)=>{
    hapticsOn = !hapticsOn;
    e.currentTarget.classList.toggle('active', hapticsOn);
  });
  if(!('vibrate' in navigator)){
    document.getElementById('hapticBtn').style.display = 'none';
  }

  // ---- Sheet ----
  const sheet = document.getElementById('sheet');
  const sheetOverlay = document.getElementById('sheetOverlay');
  function openSheet(){
    sheet.classList.add('open');
    sheetOverlay.classList.add('open');
    document.getElementById('menuBtn').classList.add('active');
  }
  function closeSheet(){
    sheet.classList.remove('open');
    sheetOverlay.classList.remove('open');
    document.getElementById('menuBtn').classList.remove('active');
  }
  document.getElementById('menuBtn').addEventListener('click', ()=>{
    if(sheet.classList.contains('open')) closeSheet(); else openSheet();
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheetOverlay.addEventListener('click', closeSheet);

  // ---- Sound (gentle filtered noise while dragging) ----
  let audioCtx = null, noiseSource = null, gainNode = null, filterNode = null;

  function ensureAudio(){
    if(audioCtx) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = 2 * audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2 - 1; }
      noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = buffer;
      noiseSource.loop = true;
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'bandpass';
      filterNode.frequency.value = 900;
      filterNode.Q.value = 0.7;
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0;
      noiseSource.connect(filterNode).connect(gainNode).connect(audioCtx.destination);
      noiseSource.start();
    }catch(err){ audioCtx = null; }
  }

  function startSound(){
    if(muted) return;
    ensureAudio();
    if(!gainNode) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.08);
  }
  function updateSound(x0,y0,x1,y1){
    if(muted || !gainNode) return;
    const speed = Math.hypot(x1-x0, y1-y0) / dpr;
    const level = Math.min(0.09, 0.03 + speed*0.002);
    gainNode.gain.linearRampToValueAtTime(level, audioCtx.currentTime + 0.05);
    filterNode.frequency.linearRampToValueAtTime(700 + Math.min(speed*6, 900), audioCtx.currentTime + 0.05);
  }
  function stopSound(){
    if(!gainNode) return;
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
  }

  document.getElementById('muteBtn').addEventListener('click', (e)=>{
    muted = !muted;
    if(muted) stopSound();
    e.currentTarget.classList.toggle('active', muted);
    const icon = document.getElementById('soundIcon');
    icon.innerHTML = muted
      ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15 9l6 6"/><path d="M21 9l-6 6"/>'
      : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M18.5 6.5a9 9 0 0 1 0 11"/>';
  });

  initAll();
})();
</script>
</body>
</html>
