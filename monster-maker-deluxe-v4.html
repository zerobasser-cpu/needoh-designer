<style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Fredoka,sans-serif;color:#241b35;background:radial-gradient(circle at 8% 14%,#fff38a 0 9%,transparent 10%),radial-gradient(circle at 91% 11%,#ff9fca 0 11%,transparent 12%),radial-gradient(circle at 12% 88%,#8cecff 0 13%,transparent 14%),radial-gradient(circle at 88% 83%,#b99cff 0 12%,transparent 13%),linear-gradient(135deg,#72ddff,#b7f5d4 36%,#ffe69b 68%,#e6b7ff);min-height:100vh}header{text-align:center;padding:22px 12px 8px}h1{font:800 clamp(40px,7vw,68px)/.9 'Baloo 2';margin:0}.sub{font-size:18px;margin:8px}.app{max-width:1500px;margin:auto;padding:14px;display:grid;grid-template-columns:310px 1fr 310px;gap:16px}.panel{background:#fffffff2;border:3px solid #241b3520;border-radius:24px;padding:15px;box-shadow:0 10px 25px #341e5018}.panel h2{font:800 25px 'Baloo 2';margin:0 0 10px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab,.choice,.btn{border:0;border-radius:14px;padding:9px 11px;font:700 14px Fredoka;cursor:pointer;background:#eee7ff;color:#241b35}.tab.active{background:#7c4dff;color:white}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:600px;overflow:auto;margin-top:10px}.choice{min-height:48px}.choice.sel{outline:3px solid #ff5fa2;background:#fff0f7}.sw{height:32px;border-radius:10px;margin-bottom:3px;border:2px solid white;box-shadow:0 0 0 2px #ddd}.stage{min-height:700px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 42%,#ffffffed 0 24%,#c7f5ffbb 44%,transparent 72%)}.stage:before{content:'';position:absolute;width:650px;height:650px;border-radius:50%;background:#ffffff55}.monster{position:relative;width:500px;height:600px;z-index:2;filter:drop-shadow(0 20px 15px #241b3530);animation:monsterBob 2.8s ease-in-out infinite}.body{position:absolute;left:125px;top:150px;width:250px;height:285px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 92%,white),var(--c) 58%,color-mix(in srgb,var(--c) 72%, /* limb system: joint sockets sit behind the body and visibly connect parts */.shoulder,.hip{position:absolute;border-radius:50%;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 92%,white),var(--c));border:6px solid #241b3545;box-shadow:inset 5px 5px 9px #fff5,inset -7px -8px 10px #0002;z-index:4}.shoulder{width:54px;height:54px;top:262px}.shoulder.l{left:78px}.shoulder.r{right:78px}.hip{width:58px;height:58px;top:392px;z-index:5}.hip.l{left:122px}.hip.r{right:122px}.arm,.leg{position:absolute;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 88%,white),var(--c) 62%,color-mix(in srgb,var(--c) 68%,#351c52));border:6px solid #241b3545;box-shadow:inset 9px 9px 13px #ffffff55,inset -10px -12px 15px #241b3538,0 8px 12px #241b3525}.arm{top:265px;width:92px;height:145px;border-radius:48% 52% 45% 55%;z-index:3}.arm.l{left:35px;transform:rotate(24deg)}.arm.r{right:35px;transform:rotate(-24deg)}.arm:before,.leg:before{content:'';position:absolute;width:24px;height:55px;left:13px;top:13px;border-radius:50%;background:#fff5;filter:blur(4px)}.arm.tiny{height:90px;width:60px;top:280px}.arm.huge{height:175px;width:108px}.arm.long{height:205px;width:72px}.arm.tentacle{width:52px;height:190px;border-radius:55% 45% 50% 50%;transform:rotate(18deg)}.arm.claw{border-radius:48% 52% 55% 45%}.arm.claw:after{content:'✦';position:absolute;font-size:30px;bottom:-30px;left:28px;color:#fff;text-shadow:0 2px 3px #0005}.arm.pincer:after{content:'🦀';position:absolute;font-size:34px;bottom:-31px;left:17px}.arm.wiggly{border-radius:45%;transform:rotate(16deg)}.arm.wiggly:after{content:'';position:absolute;right:-22px;bottom:2px;width:42px;height:42px;border-radius:50%;background:inherit;border:inherit}.leg{top:402px;width:82px;height:135px;border-radius:45% 45% 38% 38%;z-index:3}.leg.l{left:133px;transform:rotate(2deg)}.leg.r{right:133px;transform:rotate(-2deg)}.leg.big{height:150px;width:102px}.leg.tiny{height:90px;width:62px}.leg.long{height:190px;width:68px}.leg.spring{background:repeating-linear-gradient(transparent 0 14px,#39274f 15px 19px),linear-gradient(135deg,var(--c),var(--shade));border-radius:45%}.leg.three{height:128px}.leg.stumpy{height:75px;width:105px;border-radius:45%}.leg.tentacle{height:185px;width:50px;border-radius:50%}.leg.hoof{border-radius:45% 45% 25% 25%}.leg.flipper{width:110px;height:75px;border-radius:55% 45% 55% 45%}.foot{position:absolute;width:105px;height:48px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 86%,white),var(--c) 65%,#49305e);border:6px solid #241b3545;border-radius:58% 42% 48% 52%;bottom:-31px;left:50%;transform:translateX(-50%);box-shadow:inset 8px 7px 10px #ffffff55,inset -8px -8px 10px #241b3538,0 7px 10px #241b3530}.hoof .foot{border-radius:35% 35% 20% 20%;width:86px}.flipper .foot{width:125px;height:50px}.clawfoot .foot:after{content:'•••';letter-spacing:8px;position:absolute;right:5px;top:12px;color:#241b35;font-size:17px}.eye{position:absolute;width:54px;height:62px;background:linear-gradient(145deg,#fff,#e8e5ef);border:5px solid #241b3550;border-radius:50%;z-index:14;box-shadow:inset 7px 7px 10px #fff,inset -8px -10px 12px #b7c4d9,0 5px 8px #241b3530}.eye.big{width:70px;height:78px}.eye.tiny{width:39px;height:45px}.pupil{position:absolute;width:22px;height:31px;background:var(--p);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset 4px 4px 5px #ffffff66}.shine{position:absolute;width:8px;height:10px;background:white;border-radius:50%;left:12px;top:8px}.e1{left:38px;top:48px}.e2{right:38px;top:48px}.e3{left:92px;top:30px}.e4{left:92px;top:98px}.e5{left:22px;top:112px}.e6{right:22px;top:112px}.mouth{position:absolute;z-index:16;left:50%;top:168px;transform:translateX(-50%);width:98px;height:52px;background:#241b35;border:4px solid #241b3550;border-radius:12px 12px 45px 45px;box-shadow:inset 0 7px 10px #0006,0 5px 8px #241b3540}.smile{background:transparent;border:0;border-bottom:8px solid #241b35;height:45px;box-shadow:none}.grin{height:62px;border-radius:14px 14px 45px 45px}.fangs:before,.fangs:after{content:'';position:absolute;top:2px;width:14px;height:25px;background:white;clip-path:polygon(0 0,100% 0,50% 100%)}.fangs:before{left:14px}.fangs:after{right:14px}.tongue:after{content:'';position:absolute;width:34px;height:22px;background:#ff709d;border-radius:50%;bottom:-8px;left:25px}.tinyM{width:50px;height:25px}.monsterM{height:70px;width:115px;border-radius:45%;}.nose{position:absolute;left:50%;top:142px;transform:translateX(-50%);z-index:15;width:34px;height:25px;border-radius:50%;background:linear-gradient(145deg,#fff5,var(--shade));border:4px solid #241b3535}.ear{position:absolute;top:180px;width:65px;height:95px;background:linear-gradient(145deg,#fff5,var(--c),var(--shade));border:6px solid #241b3545;z-index:2}.ear.l{left:72px;border-radius:60% 35% 55% 35%;transform:rotate(-28deg)}.ear.r{right:72px;border-radius:35% 60% 35% 55%;transform:rotate(28deg)}.horn{position:absolute;top:92px;width:54px;height:92px;background:linear-gradient(135deg,#fff2a4,#ffc44d 55%,#b96a31);border:5px solid #241b3545;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:11;filter:drop-shadow(2px 3px 2px #0002)}.horn.l{left:145px;transform:rotate(-12deg)}.horn.r{right:145px;transform:rotate(12deg)}.wing{position:absolute;top:205px;width:130px;height:175px;background:linear-gradient(145deg,#f0ddff,#b99cff 65%,#7953ba);border:5px solid #241b3545;z-index:1;box-shadow:inset 10px 8px 12px #fff7,0 8px 10px #241b3530}.wing.l{left:0;clip-path:polygon(100% 50%,0 0,15% 30%,0 100%)}.wing.r{right:0;clip-path:polygon(0 50%,100% 0,85% 30%,100% 100%)}.tail{position:absolute;right:8px;top:310px;width:165px;height:90px;border:22px solid var(--shade);border-left:0;border-radius:0 80px 80px 0;z-index:1;filter:drop-shadow(3px 4px 2px #0002)}.tail.spike:after{content:'◆';position:absolute;right:-15px;top:-20px;font-size:50px;color:var(--c)}.hat{position:absolute;top:45px;left:50%;transform:translateX(-50%);z-index:20;width:125px;height:95px;background:linear-gradient(135deg,#ff9ac7,#ff4f9b);border:5px solid #241b3545;clip-path:polygon(50% 0,90% 90%,10% 90%);filter:drop-shadow(3px 4px 2px #0002)}.badge{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);z-index:18;background:white;padding:8px 14px;border-radius:20px;font-weight:800;box-shadow:0 4px 8px #0002}.controls{display:grid;gap:9px}.btn{font-size:16px;padding:12px;background:#fff0f7}.primary{background:#7c4dff;color:white}.random{background:#ffd24d}.name{font:800 22px 'Baloo 2';text-align:center;padding:10px;border:3px dashed #cbbbe9;border-radius:16px;background:#faf7ff}.stat{display:flex;justify-content:space-between;background:#f6f3fa;padding:8px 10px;border-radius:12px;margin:6px 0}.challenge{padding:12px;border-radius:16px;background:#fff8dc;margin-top:10px;font-weight:700}.hint{font-size:12px;opacity:.7;margin-top:8px;text-align:center}@keyframes monsterBob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-7px) rotate(.5deg)}}
@media(max-width:1050px){.app{grid-template-columns:1fr 1fr}.stage{grid-column:1/-1;grid-row:1}}@media(max-width:700px){.app{grid-template-columns:1fr}.stage{grid-column:auto;min-height:620px}.monster{transform:scale(.78)}}</style></head><body>
<header><h1>👾 Monster Maker Deluxe</h1><div class="sub">Build a totally bonkers monster with loads of mix-and-match body parts!</div></header>
<main class="app"><section class="panel"><h2>🧰 Monster Parts</h2><div class="tabs" id="tabs"></div><div class="choices" id="choices"></div></section><section class="panel stage"><div id="monsterArea"></div></section><section class="panel"><h2>✨ Workshop</h2><div class="controls"><button class="btn primary" onclick="randomMonster()">🎲 Random Monster</button><button class="btn" onclick="randomName()">🏷️ Give Me A Name</button><button class="btn" onclick="newChallenge()">🏆 New Challenge</button><button class="btn" onclick="saveMonster()">💾 Save Monster</button><button class="btn" onclick="downloadPage()">📥 Download Monster Maker</button><div class="name" id="name">Pickles the Wobblebeast</div></div><h2 style="margin-top:18px">📊 Monster Stats</h2><div class="stat"><span>👀 Weirdness</span><b id="weird">0</b></div><div class="stat"><span>😂 Silliness</span><b id="silly">0</b></div><div class="stat"><span>👹 Scariness</span><b id="scary">0</b></div><div class="stat"><span>🌈 Colour</span><b id="colour">0</b></div><div class="challenge" id="challenge">Challenge: Make a monster with 3 eyes!</div></section></main>
<script>const data={
Body:[['Blob','blob'],['Round','round'],['Square','square'],['Tall','tall'],['Slime','slimy'],['Robot','robot'],['Rock','rock'],['Bean','bean'],['Wide','wide'],['Ghost','ghost']],
Arms:[['Normal','normal'],['Tiny','tiny'],['Huge','huge'],['Long','long'],['Tentacles','tentacle'],['Claws','claw'],['Pincers','pincer'],['Wiggly','wiggly']],
Legs:[['Normal','two'],['Big','big'],['Tiny','tiny'],['Long','long'],['Spring','spring'],['Stumpy','stumpy'],['Tentacle','tentacle'],['Hooves','hoof'],['Flippers','flipper'],['Claw Feet','clawfoot'],['3 Legs','three']],
Eyes:[['2 Eyes','2'],['1 Cyclops','1'],['3 Eyes','3'],['4 Eyes','4'],['5 Eyes','5'],['6 Eyes','6']],
Mouth:[['Smile','smile'],['Big Grin','grin'],['Fangs','fangs'],['Tongue','tongue'],['Tiny Mouth','tinyM'],['Monster Mouth','monsterM']],
Colours:[['Slime Green','#8ee35b'],['Bubblegum','#ff78b7'],['Sky Blue','#6fd7ff'],['Purple','#a77cff'],['Sunny Yellow','#ffd84d'],['Orange','#ff9c4a'],['Red','#ff6565'],['Mint','#65e6bd'],['Midnight','#4b4770'],['White','#f4f4ff']],
Patterns:[['None','none'],['Spots','spots'],['Stripes','stripes'],['Stars','stars'],['Lightning','lightning'],['Scales','scales'],['Swirl','swirl']],
Extras:[['Nothing','none'],['Horns','horns'],['Wings','wings'],['Tail','tail'],['Spiky Tail','spiketail'],['Party Hat','hat'],['Badge','badge'],['Ears','ears'],['Nose','nose']]
};
let state={body:'blob',arms:'normal',legs:'two',eyes:'2',mouth:'smile',colours:'#8ee35b',patterns:'none',extras:'none'},active='Body';
const n1=['Pickles','Bongo','Waffle','Noodle','Muffin','Ziggy','Bubbles','Gizmo','Pogo','Tofu','Sprinkles','Wobble','Doodle','Peanut','Squiggle','Booger','Mango','Bonkers'],n2=['Wobblebeast','Gloopzilla','Snortface','Moon Monster','Fuzzbucket','Boingasaurus','Slime Goblin','Giggletron','Toothpickle','Fluffalo','Splatmonster','Grumbleblob','Crunchytoes'];
function shade(h,a=-28){if(typeof h!=='string'||!h.startsWith('#'))return '#4b365e';let n=parseInt(h.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,((n>>8)&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return `rgb(${r},${g},${b})`}
function init(){const t=document.getElementById('tabs');Object.keys(data).forEach(k=>{let b=document.createElement('button');b.className='tab';b.textContent=k;b.onclick=()=>{active=k;tabs();choices()};t.appendChild(b)});tabs();choices();draw();stats()}
function tabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent===active))}
function choices(){let q=document.getElementById('choices');q.innerHTML='';data[active].forEach(([label,val])=>{let b=document.createElement('button');b.className='choice';let key=active.toLowerCase();if(active==='Colours')b.innerHTML='<div class="sw" style="background:'+val+'"></div>'+label;else b.textContent=label;if(state[key]===val)b.classList.add('sel');b.onclick=()=>{state[key]=val;choices();draw();stats()};q.appendChild(b)})}
function eye(c){return '<div class="eye '+c+'"><div class="pupil"></div><div class="shine"></div></div>'}
function draw(){let s=state,e='';['e1','e2','e3','e4','e5','e6'].slice(0,Number(s.eyes)||2).forEach(x=>e+=eye(x));let arms='<div class="shoulder l"></div><div class="shoulder r"></div><div class="arm l '+s.arms+'"></div><div class="arm r '+s.arms+'"></div>';let legs='';if(s.legs==='three'){legs='<div class="hip l"></div><div class="hip r"></div><div class="leg l three"><div class="foot"></div></div><div class="leg" style="left:209px"><div class="foot"></div></div><div class="leg r three"><div class="foot"></div></div>'}else{legs='<div class="hip l"></div><div class="hip r"></div><div class="leg l '+s.legs+'"><div class="foot"></div></div><div class="leg r '+s.legs+'"><div class="foot"></div></div>'}let x='';if(s.extras==='horns')x='<div class="horn l"></div><div class="horn r"></div>';if(s.extras==='wings')x='<div class="wing l"></div><div class="wing r"></div>';if(s.extras==='tail'||s.extras==='spiketail')x='<div class="tail '+(s.extras==='spiketail'?'spike':'')+'"></div>';if(s.extras==='hat')x='<div class="hat"></div>';if(s.extras==='badge')x='<div class="badge">★ COOL ★</div>';if(s.extras==='ears')x='<div class="ear l"></div><div class="ear r"></div>';if(s.extras==='nose')x='<div class="nose"></div>';document.getElementById('monsterArea').innerHTML='<div class="monster" style="--c:'+s.colours+';--shade:'+shade(s.colours)+'">'+x+arms+legs+'<div class="body '+s.body+'"><div class="pattern '+s.patterns+'"></div>'+e+'<div class="mouth '+s.mouth+'"></div></div></div>'}
function stats(){let eyes=Number(state.eyes)||2;document.getElementById('weird').textContent=Math.min(99,10+eyes*6+(state.extras!=='none'?12:0)+(state.body==='ghost'?15:0));document.getElementById('silly').textContent=Math.min(99,10+(state.legs==='spring'?30:0)+(state.extras==='hat'?25:0)+(state.mouth==='tongue'?15:0)+(state.arms==='pincer'?18:0));document.getElementById('scary').textContent=Math.min(99,8+(state.mouth==='fangs'?35:0)+(state.body==='rock'?15:0)+(state.arms==='claw'?20:0));document.getElementById('colour').textContent=state.patterns==='none'?45:90}
function randomName(){document.getElementById('name').textContent=n1[Math.floor(Math.random()*n1.length)]+' the '+n2[Math.floor(Math.random()*n2.length)]}
function randomMonster(){try{Object.keys(data).forEach(k=>{const key=k.toLowerCase();const list=data[k];if(!Array.isArray(list)||!list.length)return;const pick=list[Math.floor(Math.random()*list.length)];state[key]=pick[1]});randomName();active=Object.keys(data)[Math.floor(Math.random()*Object.keys(data).length)];tabs();choices();draw();stats()}catch(err){console.error('Random monster error:',err);alert('Oops! The monster machine hiccupped. Try again!')}}
function newChallenge(){let a=['Make a monster with 3 eyes!','Build the silliest monster possible!','Give your monster wings and a tail!','Make a monster with fangs and horns!','Create a rainbow-looking monster!','Make a monster with spring legs!','Build a robot monster!','Make the weirdest monster you can!','Make a monster with flippers!','Create a monster with tiny arms and huge feet!'];document.getElementById('challenge').textContent='Challenge: '+a[Math.floor(Math.random()*a.length)]}
function saveMonster(){let b=new Blob([JSON.stringify({state,name:document.getElementById('name').textContent},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-monster.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function downloadPage(){let b=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='monster-maker-deluxe.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
init();
</script></body></html>
