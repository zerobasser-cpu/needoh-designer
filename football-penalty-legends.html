<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Football Penalty Legends</title>

<style>
:root{
  --green:#159447;
  --green2:#0b6d35;
  --white:#fff;
  --ink:#142235;
  --gold:#ffd447;
  --red:#ef4050;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#69c9ff 0,#2375b7 42%,#102f4e 100%);
  color:var(--ink);
  overflow-x:hidden;
}

body{
  display:flex;
  justify-content:center;
  padding:12px;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:min(1200px,100%);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  color:#fff;
}

.logo{
  font-size:clamp(20px,4vw,34px);
  font-weight:1000;
  letter-spacing:-1.5px;
  text-shadow:0 3px 0 rgba(0,0,0,.2);
}

.logo span{
  color:var(--gold);
}

.coins{
  display:flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.25);
  padding:9px 15px;
  border-radius:999px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.coin{
  width:24px;
  height:24px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#fff27b,#ffb600);
  color:#9b5a00;
  border:2px solid #ffe783;
  font-size:13px;
  font-weight:1000;
}

.game-card{
  background:rgba(255,255,255,.94);
  border-radius:24px;
  padding:12px;
  box-shadow:0 18px 45px rgba(0,0,0,.25);
  overflow:hidden;
}

.stadium{
  position:relative;
  width:100%;
  height:min(72vh,700px);
  min-height:510px;
  border-radius:18px;
  overflow:hidden;
  background:#56b7e9;
  touch-action:none;
  user-select:none;
}

.sky{
  position:absolute;
  inset:0 0 54% 0;
  background:
    radial-gradient(circle at 18% 25%,rgba(255,255,255,.95) 0 22px,transparent 23px),
    radial-gradient(circle at 20% 25%,rgba(255,255,255,.8) 0 40px,transparent 41px),
    radial-gradient(circle at 75% 19%,rgba(255,255,255,.85) 0 24px,transparent 25px),
    linear-gradient(#59c7f7,#8bddff);
}

.sun{
  position:absolute;
  right:7%;
  top:7%;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff2a5;
  box-shadow:0 0 45px rgba(255,240,125,.8);
}

.stands{
  position:absolute;
  left:0;
  right:0;
  top:28%;
  height:27%;
  background:
    repeating-linear-gradient(
      90deg,
      #d9dce0 0 18px,
      #a9afb5 18px 23px
    );
  border-top:10px solid #4d545c;
  border-bottom:8px solid #343a40;
  overflow:hidden;
}

.crowd{
  position:absolute;
  inset:8px;
  display:grid;
  grid-template-columns:repeat(26,1fr);
  gap:5px;
  align-items:center;
  opacity:.9;
}

.crowd i{
  display:block;
  width:100%;
  height:65%;
  border-radius:50% 50% 35% 35%;
  background:#e94455;
  box-shadow:
    7px 4px 0 #276ce2,
    14px -1px 0 #ffd447,
    3px 13px 0 #2db76a;
}

.crowd i:nth-child(3n){
  transform:translateY(5px);
}

.crowd i:nth-child(4n){
  transform:translateY(-5px);
}

.floodlight{
  position:absolute;
  top:9%;
  width:95px;
  height:150px;
  z-index:2;
}

.floodlight.left{
  left:3%;
}

.floodlight.right{
  right:3%;
  transform:scaleX(-1);
}

.flood-pole{
  position:absolute;
  bottom:0;
  left:43px;
  width:9px;
  height:130px;
  background:#414a52;
  transform:rotate(8deg);
  transform-origin:bottom;
}

.flood-head{
  position:absolute;
  top:3px;
  left:13px;
  width:62px;
  height:28px;
  border-radius:8px;
  background:#39434c;
  transform:rotate(-8deg);
  box-shadow:0 0 25px rgba(255,255,220,.8);
}

.flood-head:after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:4px;
  background:#fff9c7;
}

.pitch{
  position:absolute;
  left:-8%;
  right:-8%;
  bottom:-15%;
  height:64%;
  background:
    repeating-linear-gradient(
      90deg,
      #258f40 0 85px,
      #2a9a45 85px 170px
    );
  transform:perspective(600px) rotateX(9deg);
  transform-origin:center bottom;
}

.pitch:before{
  content:"";
  position:absolute;
  left:50%;
  top:7%;
  width:70%;
  height:70%;
  transform:translateX(-50%);
  border:3px solid rgba(255,255,255,.72);
  border-radius:50%;
}

.pitch:after{
  content:"";
  position:absolute;
  left:50%;
  top:3%;
  width:90%;
  height:3px;
  transform:translateX(-50%);
  background:rgba(255,255,255,.7);
}


/* ==========================================
   GOAL
========================================== */

.goal{
  position:absolute;
  z-index:6;

  /*
    Larger and visually further away.
    The old goal was lower and smaller.
  */
  left:50%;
  top:23%;
  width:min(72%,760px);
  height:34%;

  transform:translateX(-50%);
}

.net{
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.48) 0 2px,
      transparent 2px 17px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.48) 0 2px,
      transparent 2px 17px
    );

  border:5px solid #fff;

  box-shadow:
    0 5px 0 #bfc7ce,
    inset 0 0 25px rgba(0,0,0,.15);

  transform:perspective(500px) rotateX(-5deg);
}

.post{
  position:absolute;
  background:#fff;
  border-radius:3px;
  box-shadow:0 3px 0 #bfc4c8;
  z-index:4;
}

.post.left{
  left:0;
  top:0;
  width:11px;
  height:100%;
}

.post.right{
  right:0;
  top:0;
  width:11px;
  height:100%;
}

.post.cross{
  left:0;
  right:0;
  top:0;
  height:11px;
}


/* ==========================================
   KEEPER
========================================== */

.keeper{
  position:absolute;
  left:50%;

  /*
    Keep the goalkeeper aligned with
    the larger/further-away goal.
  */
  top:23%;

  width:115px;
  height:195px;

  transform:translateX(-50%);

  z-index:9;
  transform-origin:center bottom;
  transition:transform .46s cubic-bezier(.2,.8,.25,1);
  pointer-events:none;
}

.keeper.dl{
  transform:translateX(-50%) translateX(-190px) rotate(-28deg);
}

.keeper.dr{
  transform:translateX(-50%) translateX(190px) rotate(28deg);
}

.keeper.dc{
  transform:translateX(-50%) translateY(-7px) scale(1.04);
}

.keeperHead{
  position:absolute;
  width:42px;
  height:45px;
  left:36px;
  top:0;
  border-radius:50%;
  background:#e5a579;
  border:3px solid rgba(0,0,0,.12);
  z-index:5;
}

.keeperHead:after{
  content:"";
  position:absolute;
  left:7px;
  top:16px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#202020;
  box-shadow:22px 0 #202020;
}

.keeperHair{
  position:absolute;
  left:35px;
  top:-4px;
  width:45px;
  height:17px;
  border-radius:50% 50% 35% 35%;
  background:#24201d;
  z-index:7;
}

.keeperBody{
  position:absolute;
  left:30px;
  top:43px;
  width:55px;
  height:75px;
  border-radius:17px 17px 12px 12px;
  background:linear-gradient(90deg,#1654c9,#2f83f5,#1654c9);
  border:3px solid rgba(0,0,0,.13);
  z-index:4;
}

.keeperBody:after{
  content:"GK";
  position:absolute;
  left:50%;
  top:21px;
  transform:translateX(-50%);
  color:#fff;
  font-size:15px;
  font-weight:1000;
}

.keeperArm{
  position:absolute;
  top:47px;
  width:23px;
  height:76px;
  border-radius:20px;
  background:#2879e7;
  z-index:3;
  transform-origin:top center;
}

.leftArm{
  left:11px;
  transform:rotate(30deg);
}

.rightArm{
  right:11px;
  transform:rotate(-30deg);
}

.glove{
  position:absolute;
  bottom:-5px;
  left:50%;
  width:27px;
  height:27px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#f4f4f4;
  border:2px solid #bfc8d0;
}

.keeperLeg{
  position:absolute;
  top:108px;
  width:22px;
  height:76px;
  border-radius:14px;
  background:#173c9d;
  z-index:2;
}

.leftLeg{
  left:34px;
  transform:rotate(5deg);
}

.rightLeg{
  right:34px;
  transform:rotate(-5deg);
}

.keeperBoot{
  position:absolute;
  bottom:-5px;
  width:38px;
  height:16px;
  border-radius:12px 12px 6px 6px;
  background:#16191d;
}

.leftLeg .keeperBoot{
  left:-7px;
}

.rightLeg .keeperBoot{
  right:-7px;
}


/* ==========================================
   KICKER
========================================== */

.kicker{
  --shirt:#ef4b55;
  --hair:#35251f;

  position:absolute;
  left:50%;
  bottom:1.5%;
  width:125px;
  height:205px;
  transform:translateX(-50%);
  transform-origin:center bottom;
  z-index:11;
  pointer-events:none;
}

.kicker.aiming{
  transform:translateX(-50%) rotate(-3deg) translateY(-4px);
}

.kicker.kicking{
  animation:kickerKick .48s ease-out;
}

@keyframes kickerKick{
  0%{
    transform:translateX(-50%) rotate(0) translateY(0);
  }

  25%{
    transform:translateX(-50%) rotate(-7deg) translateY(-7px);
  }

  52%{
    transform:translateX(-50%) rotate(5deg) translateY(-10px);
  }

  100%{
    transform:translateX(-50%) rotate(0) translateY(0);
  }
}

.kickerHead{
  position:absolute;
  left:42px;
  top:0;
  width:44px;
  height:47px;
  border-radius:50%;
  background:#d9946b;
  border:3px solid rgba(0,0,0,.12);
  z-index:5;
}

.kickerHead:before,
.kickerHead:after{
  content:"";
  position:absolute;
  top:19px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#201b1b;
}

.kickerHead:before{
  left:10px;
}

.kickerHead:after{
  right:10px;
}

.kickerHair{
  position:absolute;
  left:39px;
  top:-6px;
  width:51px;
  height:23px;
  border-radius:50% 55% 30% 35%;
  background:var(--hair);
  z-index:6;
}

.kickerBody{
  position:absolute;
  left:34px;
  top:44px;
  width:58px;
  height:80px;
  border-radius:18px 18px 13px 13px;
  background:var(--shirt);
  border:3px solid rgba(0,0,0,.14);
  z-index:4;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);
}

.kickerNumber{
  position:absolute;
  left:50%;
  top:21px;
  transform:translateX(-50%);
  color:#fff;
  font-weight:1000;
  font-size:18px;
  text-shadow:0 2px 2px rgba(0,0,0,.2);
}

.kickerArm{
  position:absolute;
  top:50px;
  width:19px;
  height:67px;
  border-radius:14px;
  background:var(--shirt);
  z-index:3;
  transform-origin:top center;
}

.kickerLeftArm{
  left:18px;
  transform:rotate(15deg);
}

.kickerRightArm{
  right:18px;
  transform:rotate(-15deg);
}

.kickerLeg{
  position:absolute;
  top:114px;
  width:25px;
  height:75px;
  border-radius:14px;
  background:#eee;
  z-index:2;
  transform-origin:top center;
}

.kickerLeftLeg{
  left:39px;
}

.kickerRightLeg{
  right:39px;
}

.kicker.kicking .kickerRightLeg{
  animation:kickLeg .48s ease-out;
}

@keyframes kickLeg{
  0%{transform:rotate(0)}
  35%{transform:rotate(-20deg)}
  65%{transform:rotate(42deg) translateY(-2px)}
  100%{transform:rotate(0)}
}

.kickerBoot{
  position:absolute;
  bottom:-5px;
  width:43px;
  height:18px;
  border-radius:12px 15px 7px 7px;
  background:#16191e;
}

.kickerLeftLeg .kickerBoot{
  left:-8px;
}

.kickerRightLeg .kickerBoot{
  right:-8px;
}


/* ==========================================
   BALL
========================================== */

.ball{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  z-index:20;
  left:50%;
  top:91%;
  transform:translate(-50%,-50%);

  background:
    radial-gradient(circle at 50% 48%,#111 0 8px,transparent 9px),
    radial-gradient(circle at 20% 25%,#111 0 6px,transparent 7px),
    radial-gradient(circle at 80% 28%,#111 0 6px,transparent 7px),
    radial-gradient(circle at 27% 78%,#111 0 6px,transparent 7px),
    radial-gradient(circle at 76% 77%,#111 0 6px,transparent 7px),
    #fff;

  box-shadow:
    0 7px 10px rgba(0,0,0,.35),
    inset -4px -5px 0 rgba(0,0,0,.08);

  touch-action:none;
}

.ball.dragging{
  box-shadow:
    0 12px 18px rgba(0,0,0,.3),
    0 0 0 6px rgba(255,255,255,.12);
}


/* ==========================================
   TRAJECTORY
========================================== */

.trajectory{
  position:absolute;
  z-index:14;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:visible;
  display:none;
}

.trajectory path{
  fill:none;
  stroke:rgba(255,255,255,.9);
  stroke-width:4;
  stroke-linecap:round;
  stroke-dasharray:8 10;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.6));
}

.trajectory circle{
  fill:#fff;
  opacity:.9;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.9));
}

.target{
  position:absolute;
  z-index:18;
  width:70px;
  height:70px;
  border:3px solid rgba(255,255,255,.95);
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:none;
  box-shadow:
    0 0 0 2px rgba(255,90,90,.35),
    0 0 20px rgba(255,255,255,.45);
}

.target:before{
  content:"";
  position:absolute;
  inset:10px;
  border:2px dashed rgba(255,255,255,.7);
  border-radius:50%;
}

.target:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ff5252;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(255,82,82,.8);
}


/* ==========================================
   POWER
========================================== */

.powerBox{
  position:absolute;
  left:18px;
  bottom:18px;
  z-index:30;
  width:190px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(0,0,0,.48);
  color:#fff;
  backdrop-filter:blur(8px);
}

.powerLabel{
  display:flex;
  justify-content:space-between;
  font-weight:900;
  font-size:12px;
  margin-bottom:6px;
}

.powerTrack{
  height:10px;
  background:rgba(255,255,255,.2);
  border-radius:999px;
  overflow:hidden;
}

.powerFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#35d276,#ffe04c,#ff5b4d);
  border-radius:inherit;
  transition:width .08s linear;
}


/* ==========================================
   HUD
========================================== */

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:12px;
}

.stat{
  background:#f4f7fa;
  border-radius:15px;
  padding:10px;
  text-align:center;
  border:1px solid #e2e8ee;
}

.stat b{
  display:block;
  font-size:20px;
  font-weight:1000;
}

.stat span{
  font-size:10px;
  color:#687585;
  font-weight:800;
  text-transform:uppercase;
}


/* ==========================================
   CONTROLS
========================================== */

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.action{
  padding:12px 20px;
  border-radius:13px;
  font-weight:1000;
  color:#fff;
  background:#1d2836;
  box-shadow:0 5px 0 rgba(0,0,0,.18);
}

.action.green{
  background:var(--green);
}

.action.gold{
  background:#d99b00;
}

.action:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.18);
}


/* ==========================================
   MESSAGE
========================================== */

.message{
  position:absolute;
  z-index:50;
  left:50%;
  top:51%;
  transform:translate(-50%,-50%) scale(.7);
  min-width:min(82%,430px);
  text-align:center;
  padding:20px 26px;
  border-radius:22px;
  color:#fff;
  background:rgba(11,23,38,.92);
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 20px 55px rgba(0,0,0,.35);
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
}

.message.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.message .big{
  font-size:clamp(30px,7vw,58px);
  font-weight:1000;
  line-height:1;
  margin-bottom:8px;
}

.message .small{
  font-size:16px;
  font-weight:800;
  color:#dce7ef;
}


/* ==========================================
   PARTICLES
========================================== */

.particle{
  position:absolute;
  z-index:60;
  width:10px;
  height:10px;
  border-radius:50%;
  pointer-events:none;
  animation:particleFly .75s ease-out forwards;
}

@keyframes particleFly{
  to{
    transform:translate(var(--dx),var(--dy)) scale(0);
    opacity:0;
  }
}


/* ==========================================
   SHOP
========================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(3,12,20,.72);
  backdrop-filter:blur(7px);
}

.modal.open{
  display:flex;
}

.modalBox{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:25px;
  padding:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.modalHeader h2{
  margin:0;
  font-size:28px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#edf1f4;
  font-weight:1000;
  font-size:20px;
}

.playerGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.playerCard{
  border:2px solid #e4e9ee;
  border-radius:17px;
  padding:13px;
  text-align:center;
  background:#fafbfc;
}

.playerCard.selected{
  border-color:#159447;
  box-shadow:0 0 0 3px rgba(21,148,71,.12);
}

.playerAvatar{
  width:70px;
  height:70px;
  margin:0 auto 8px;
  border-radius:50%;
  position:relative;
  background:#d9956d;
  border:4px solid #fff;
  box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.playerAvatar:before{
  content:"";
  position:absolute;
  width:48px;
  height:20px;
  left:7px;
  top:-5px;
  border-radius:50%;
  background:var(--hair);
}

.playerCard h3{
  margin:5px 0;
  font-size:16px;
}

.playerCard p{
  min-height:32px;
  margin:0 0 8px;
  color:#687585;
  font-size:11px;
}

.price{
  font-weight:1000;
  margin-bottom:8px;
  color:#a66c00;
}

.buy{
  width:100%;
  padding:9px;
  border-radius:10px;
  background:#1c2a38;
  color:#fff;
  font-weight:900;
}

.buy.owned{
  background:#159447;
}

.buy:disabled{
  opacity:.55;
  cursor:default;
}

.confirmBox{
  max-width:430px;
  text-align:center;
}

.confirmBox h2{
  margin-top:0;
}

.confirmActions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:18px;
}

.confirmActions button{
  padding:11px 20px;
  border-radius:12px;
  font-weight:900;
}

.cancel{
  background:#e9edf0;
}

.danger{
  color:#fff;
  background:#e44451;
}

function audio(){

      )();

  if(audioCtx.state==="suspended"){

}


function tone(
  freq,
  duration,
  type="sine",
  volume=.07
){

  try{

    const ctx=audio();

    const osc=
      ctx.createOscillator();

    const gain=
      ctx.createGain();

    osc.type=type;

    osc.frequency.value=
      freq;

    gain.gain.setValueAtTime(
      volume,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
      ctx.currentTime+
      duration
    );

  }catch(e){}

}

/* ==========================================
   BALL POSITION
========================================== */

let ballStartX=0;
let ballStartY=0;


function resetBall(){

  const rect=
    stadium.getBoundingClientRect();

  ballStartX=
    rect.width/2;

  ballStartY=
    rect.height*.91;

  ball.style.left=
    ballStartX+"px";

  ball.style.top=
    ballStartY+"px";

  ball.style.transform=
    "translate(-50%,-50%)";

  ball.style.transition="";

  ball.classList.remove(
    "dragging"
  );

  kicker.classList.remove(
    "aiming",
    "kicking"
  );

    "none";

  trajectory.style.display=
    "none";

    "0%";

  powerText.textContent=
    "0%";

  keeper.className=
    "keeper";

  shotActive=false;
  aiming=false;

/* ==========================================
   GOAL GEOMETRY
========================================== */

/*
  This is the important new system.

  Instead of saying:

      "if the ball is somewhere around
       the top half of the screen, goal"

  we inspect the ACTUAL goal posts.

  The ball must physically fit between
  the two posts and underneath the
  crossbar.
*/


function getGoalOpening(){

  const stadiumRect=
    stadium.getBoundingClientRect();

  const leftPost=
    goal.querySelector(".post.left");

  const rightPost=
    goal.querySelector(".post.right");

  const crossbar=
    goal.querySelector(".post.cross");

  const leftRect=
    leftPost.getBoundingClientRect();

  const rightRect=
    rightPost.getBoundingClientRect();

  const crossRect=
    crossbar.getBoundingClientRect();

  const goalRect=
    goal.getBoundingClientRect();


  return{

    left:
      leftRect.right-
      stadiumRect.left,

    right:
      rightRect.left-
      stadiumRect.left,

    top:
      crossRect.bottom-
      stadiumRect.top,

    bottom:
      goalRect.bottom-
      stadiumRect.top

  };

}


/*
  Check whether the WHOLE ball is inside
  the goal opening.

  This means the ball cannot clip through
  the outside of a post and still score.
*/

function ballIsInsideGoal(
  x,
  y
){

  const opening=
    getGoalOpening();

  /*
    The ball is approximately 48px,
    so use half its current size.
  */

  const radius=
    ball.getBoundingClientRect().width/2;


  const insideLeft=
    x-radius>
    opening.left;

  const insideRight=
    x+radius<
    opening.right;

  const insideTop=
    y-radius>
    opening.top;

  const insideBottom=
    y+radius<
    opening.bottom;


  return(
    insideLeft&&
    insideRight&&
    insideTop&&
    insideBottom
  );

}


/* ==========================================
   AIMING SYSTEM
========================================== */

let aiming=false;
let shotActive=false;

let currentAim=null;


/*
  Calculate shot.

  IMPORTANT CHANGE:

  The destination is NO LONGER forced
  inside the goal.

  That means the player can actually
  shoot:

       wide left
       wide right
       over the bar
       too low

  and those shots will correctly miss.
*/


function calculateShotFromDrag(point){

  const rect=
    stadium.getBoundingClientRect();

  const dx=
    point.x-
    ballStartX;

  const dy=
    point.y-
    ballStartY;

  const distance=
    Math.sqrt(
      dx*dx+
      dy*dy
    );


  /*
    Power is based on how far
    the player drags.
  */

  const strength=
    Math.max(
      .15,
      Math.min(
        1,
        distance/360
      )
    );


  const player=
    selectedPlayer();


  /*
    Horizontal destination.

    We deliberately DO NOT clamp this
    to the goal.

    This allows genuine wide shots.
  */

  let targetX=
    ballStartX+
    dx*1.65;


  /*
    Vertical destination.

    Upward drag = higher shot.
  */

  let targetY=
    ballStartY-
    strength*
    400*
    player.power;


  /*
    Small horizontal movement keeps
    the shot roughly central.
  */

  if(
    Math.abs(dx)<18
  ){

    targetX=
      ballStartX;

  }


  /*
    Keep the ball on the stadium rather
    than allowing it to fly completely
    off-screen.

    Notice this is NOT the goal area.
  */

  targetX=
    Math.max(
      2,
      Math.min(
        rect.width-2,
        targetX
      )
    );


  targetY=
    Math.max(
      -40,
      Math.min(
        rect.height*.72,
        targetY
      )
    );


  /*
    Curve affects the flight path only.

    It does NOT change the final target.
  */

  const curveStrength=
    dx*
    .18*
    (player.curve-1);


  return{

    startX:ballStartX,

    startY:ballStartY,

    targetX,

    targetY,

    strength,

    curve:curveStrength

  };

}


/* ==========================================
   TRAJECTORY POINT
========================================== */

function trajectoryPoint(
  shot,
  t
){

  const ease=
    1-
    Math.pow(
      1-t,
      2
    );


  const x=
    shot.startX+
    (
      shot.targetX-
      shot.startX
    )*
    ease+
    Math.sin(
      Math.PI*t
    )*
    shot.curve;


  const arc=
    Math.sin(
      Math.PI*t
    )*
    Math.min(
      95,
      30+
      shot.strength*65
    );


  const y=
    shot.startY+
    (
      shot.targetY-
      shot.startY
    )*
    ease-
    arc;


  return{
    x,
    y
  };

}


/* ==========================================
   TRAJECTORY PREVIEW
========================================== */

function updateTrajectoryPreview(
  shot
){

  const rect=
    stadium.getBoundingClientRect();

  const width=
    rect.width;

  const height=
    rect.height;


  trajectory.setAttribute(
    "viewBox",
    `0 0 ${width} ${height}`
  );


  let d="";

  const samples=32;


  for(
    let i=0;
    i<=samples;
    i++
  ){

    const t=
      i/samples;

    const p=
      trajectoryPoint(
        shot,
        t
      );


    if(i===0){

      d+=
        `M ${p.x} ${p.y}`;

    }else{

      d+=
        ` L ${p.x} ${p.y}`;

    }

  }


  trajectoryPath.setAttribute(
    "d",
    d
  );


  trailDots.forEach(
    (dot,index)=>{

      const t=
        .18+
        index*.15;

      const p=
        trajectoryPoint(
          shot,
          t
        );


      dot.setAttribute(
        "cx",
        p.x
      );

      dot.setAttribute(
        "cy",
        p.y
      );

    }
  );


  /*
    Target is now the EXACT final
    destination of the ball.

    It may be inside OR outside
    the goal.
  */

  const end=
    trajectoryPoint(
      shot,
      1
    );


  target.style.left=
    end.x+"px";

  target.style.top=
    end.y+"px";

  target.style.display=
    "block";

  trajectory.style.display=
    "block";


  const percent=
    Math.round(
      shot.strength*100
    );


  powerFill.style.width=
    percent+"%";

  powerText.textContent=
    percent+"%";

}


/* ==========================================
   POINTER
========================================== */

function pointerPosition(e){

  const rect=
    stadium.getBoundingClientRect();

  return{

    x:
      e.clientX-
      rect.left,

    y:
      e.clientY-
      rect.top

}


function beginAim(e){

  if(shotActive){
    return;
  }

  e.preventDefault();

  audio();

  aiming=true;

  currentAim=
    pointerPosition(e);

  ball.classList.add(
    "dragging"
  );

  kicker.classList.add(
    "aiming"
  );


  try{

    ball.setPointerCapture(
      e.pointerId
    );

  }catch(err){}


  const shot=
    calculateShotFromDrag(
      currentAim
    );


  updateTrajectoryPreview(
    shot
  );

}


function moveAim(e){

  if(
    !aiming||
    shotActive
  ){
    return;
  }

  e.preventDefault();


  currentAim=
    pointerPosition(e);


  const shot=
    calculateShotFromDrag(
      currentAim
    );


  updateTrajectoryPreview(
    shot
  );

}


function endAim(e){

  if(
    !aiming||
    shotActive
  ){
    return;
  }

  e.preventDefault();


  const point=
    currentAim||
    pointerPosition(e);


  aiming=false;


  ball.classList.remove(
    "dragging"
  );


  shoot(point);

}


/* ==========================================
   KEEPER AI
========================================== */

function goalkeeperChoice(
  targetX
){

  const rect=
    stadium.getBoundingClientRect();

  const nx=
    targetX/
    rect.width;

  const r=
    Math.random();


  if(nx<.42){

    if(r<.58){
      return"dl";
    }

    if(r<.79){
      return"dc";
    }

    return"dr";

  }


  if(nx>.58){

    if(r<.58){
      return"dr";
    }

    if(r<.79){
      return"dc";
    }

    return"dl";

  }


  if(r<.58){
    return"dc";
  }


  return r<.79
    ?"dl"
    :"dr";

}


/* ==========================================
   KEEPER COLLISION
========================================== */

function getKeeperHitBoxes(){

  const stadiumRect=
    stadium.getBoundingClientRect();


  const parts=[

    keeper.querySelector(
      ".keeperHead"
    ),

    keeper.querySelector(
      ".keeperBody"
    ),

    keeper.querySelector(
      ".leftArm"
    ),

    keeper.querySelector(
      ".rightArm"
    )

  ];


  return parts.map(
    el=>{

      const r=
        el.getBoundingClientRect();


      const shrinkX=
        r.width*.13;

      const shrinkY=
        r.height*.08;


      return{

        left:
          r.left-
          stadiumRect.left+
          shrinkX,

        right:
          r.right-
          stadiumRect.left-
          shrinkX,

        top:
          r.top-
          stadiumRect.top+
          shrinkY,

        bottom:
          r.bottom-
          stadiumRect.top-
          shrinkY

      };

    }
  );

}


function ballHitsKeeper(
  x,
  y,
  radius
){

  const boxes=
    getKeeperHitBoxes();

  const padding=
    1.5;


  return boxes.some(
    b=>

      x+radius>=
      b.left-padding&&

      x-radius<=
      b.right+padding&&

      y+radius>=
      b.top-padding&&

      y-radius<=
      b.bottom+padding

  );

}


function segmentHitsKeeper(
  x1,
  y1,
  x2,
  y2,
  radius
){

  const steps=5;


  for(
    let i=0;
    i<=steps;
    i++
  ){

    const t=
      i/steps;


    const x=
      x1+
      (x2-x1)*
      t;


    const y=
      y1+
      (y2-y1)*
      t;


    if(
      ballHitsKeeper(
        x,
        y,
        radius
      )
    ){

      return true;

    }

  }


  return false;

}


/* ==========================================
   PARTICLES
========================================== */

function particles(
  x,
  y,
  count=18
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const p=
      document.createElement(
        "div"
      );


    p.className=
      "particle";


    p.style.left=
      x+"px";


    p.style.top=
      y+"px";


    p.style.background=

      [
        "#fff",
        "#ffd447",
        "#38d47b",
        "#ff5968",
        "#4ea0ff"

      ][
        Math.floor(
          Math.random()*5
        )
      ];


    p.style.setProperty(
      "--dx",
      `${(Math.random()-.5)*180}px`
    );


    p.style.setProperty(
      "--dy",
      `${(Math.random()-.8)*150}px`
    );


    stadium.appendChild(
      p
    );


    setTimeout(
      ()=>p.remove(),
      800
    );

  }

}


/* ==========================================
   MESSAGE
========================================== */

let messageTimer=null;


function showMessage(
  big,
  small
){

  messageBig.textContent=
    big;

  messageSmall.textContent=
    small;


  message.classList.add(
    "show"
  );


  clearTimeout(
    messageTimer
  );


  messageTimer=
    setTimeout(
      ()=>{

        message.classList.remove(
          "show"
        );

      },
      1300
    );

}


/* ==========================================
   SHOOT
========================================== */

function shoot(point){

  if(shotActive){
    return;
  }


  shotActive=true;


  target.style.display=
    "none";

  trajectory.style.display=
    "none";


  kicker.classList.remove(
    "aiming"
  );


  kicker.classList.remove(
    "kicking"
  );


  void kicker.offsetWidth;


  kicker.classList.add(
    "kicking"
  );


  kickSound();


  /*
    Calculate ONCE.

    This same shot object controls
    the entire flight.
  */

  const shot=
    calculateShotFromDrag(
      point
    );


  const keeperChoice=
    goalkeeperChoice(
      shot.targetX
    );


  keeper.className=
    "keeper";


  setTimeout(
    ()=>{

      if(shotActive){

        keeper.classList.add(
          keeperChoice
        );

      }

    },
    110
  );


  const duration=
    760-
    shot.strength*180;


  const startTime=
    performance.now();


  let collided=false;


  let previous=
    trajectoryPoint(
      shot,
      0
    );


  function frame(now){

    if(!shotActive){
      return;
    }


    const elapsed=
      now-startTime;


    const t=
      Math.min(
        1,
        elapsed/duration
      );


    const current=
      trajectoryPoint(
        shot,
        t
      );


    ball.style.left=
      current.x+"px";


    ball.style.top=
      current.y+"px";


    /*
      Check keeper collision while
      the ball is travelling.
    */

    if(
      !collided&&
      segmentHitsKeeper(
        previous.x,
        previous.y,
        current.x,
        current.y,
        24
      )
    ){

      collided=true;


      handleKeeperCollision(
        current.x,
        current.y
      );


      return;

    }


    previous=
      current;


    if(t<1){

      requestAnimationFrame(
        frame
      );

    }else{

      /*
        The ball has reached its exact
        destination.

        NOW we check the real goal.
      */

      finishShotAtDestination(
        shot.targetX,
        shot.targetY
      );

    }

  }


  requestAnimationFrame(
    frame
  );

}


/* ==========================================
   KEEPER SAVE
========================================== */

function handleKeeperCollision(
  x,
  y
){

  saveSound();


  state.shots++;


  state.streak=0;


  const player=
    selectedPlayer();


  const baseReward=
    state.shots%5===0
      ?20
      :10;


  const reward=
    Math.round(
      baseReward*
      player.bonus
    );


  state.coins+=
    reward;


  save();

  updateUI();


  particles(
    x,
    y,
    22
  );


  showMessage(
    "🧤 SAVED!",
    `+${reward} coins`
  );


  /*
    Rebound.
  */

  const reboundX=
    x<
    stadium.clientWidth/2
      ?x-90
      :x+90;


  const reboundY=
    y+65;


  ball.style.transition=
    "left .32s ease-out,top .32s ease-out";


  ball.style.left=
    reboundX+"px";


  ball.style.top=
    reboundY+"px";


  setTimeout(
    ()=>{

      ball.style.transition="";

      resetBall();

    },
    420
  );

}


/* ==========================================
   FINISH SHOT
========================================== */

/*
  NEW ACCURATE GOAL CHECK.

  We don't use percentages anymore.

  The actual DOM goal geometry is used.
*/

function finishShotAtDestination(
  targetX,
  targetY
){

  if(!shotActive){
    return;
  }


  const scored=
    ballIsInsideGoal(
      targetX,
      targetY
    );


  if(scored){

    finishGoal(
      targetX,
      targetY
    );

  }else{

    finishMiss();

  }

}


/* ==========================================
   MISS
========================================== */

function finishMiss(){

  if(!shotActive){
    return;
  }


  state.shots++;

  state.streak=0;


  const player=
    selectedPlayer();


  const baseReward=
    state.shots%5===0
      ?20
      :10;


  const reward=
    Math.round(
      baseReward*
      player.bonus
    );


  state.coins+=
    reward;


  save();

  updateUI();


  showMessage(
    "😬 MISS!",
    `+${reward} coins`
  );


  setTimeout(
    resetBall,
    400
  );

}


/* ==========================================
   GOAL
========================================== */

function finishGoal(
  x,
  y
){

  if(!shotActive){
    return;
  }


  state.shots++;

  state.goals++;

  state.streak++;


  if(
    state.streak>
    state.best
  ){

    state.best=
      state.streak;

  }


  const player=
    selectedPlayer();


  const shotReward=
    state.shots%5===0
      ?20
      :10;


  let total=
    Math.round(
      shotReward*
      player.bonus
    );


  /*
    Normal goal bonus.
  */

  total+=25;


  const opening=
    getGoalOpening();


  /*
    Top corner bonus now uses the
    ACTUAL goal opening.
  */

  const goalWidth=
    opening.right-
    opening.left;


  const goalHeight=
    opening.bottom-
    opening.top;


  const nx=
    (
      x-
      opening.left
    )/
    goalWidth;


  const ny=
    (
      y-
      opening.top
    )/
    goalHeight;


  const topCorner=
    (
      nx<.25||
      nx>.75
    )&&
    ny<.25;


  if(topCorner){

    total+=50;

  }


  state.coins+=
    total;


  save();

  updateUI();


  goalSound();


  particles(
    x,
    y,
    topCorner?40:28
  );


  showMessage(

    topCorner
      ?"🔥 TOP CORNER!"
      :"⚽ GOOOOAL!",

    topCorner
      ?`+${total} coins • TOP CORNER +50`
      :`+${total} coins`

  );


  ball.style.transition=
    "transform .18s ease-out";


  ball.style.transform=
    "translate(-50%,-50%) scale(1.08)";


  setTimeout(
    ()=>{

      ball.style.transform=
        "translate(-50%,-50%) scale(.92)";

    },
    170
  );


  setTimeout(
    ()=>{

      ball.style.transition="";

      resetBall();

    },
    750
  );

}


/* ==========================================
   POINTER EVENTS
========================================== */

ball.addEventListener(
  "pointerdown",
  beginAim
);

ball.addEventListener(
  "pointermove",
  moveAim
);

ball.addEventListener(
  "pointerup",
  endAim
);

ball.addEventListener(
  "pointercancel",
  endAim
);


/* ==========================================
   SHOP
========================================== */

shopBtn.addEventListener(
  "click",
  ()=>{

    shopModal.classList.add(
      "open"
    );

    renderShop();

  }
);


closeShop.addEventListener(
  "click",
  ()=>{

    shopModal.classList.remove(
      "open"
    );

  }
);


shopModal.addEventListener(
  "click",
  e=>{

    if(e.target===shopModal){

      shopModal.classList.remove(
        "open"
      );

    }

  }
);


/* ==========================================
   RESET
========================================== */

resetBtn.addEventListener(
  "click",
  ()=>{

    resetModal.classList.add(
      "open"
    );

  }
);


cancelReset.addEventListener(
  "click",
  ()=>{

    resetModal.classList.remove(
      "open"
    );

  }
);


confirmReset.addEventListener(
  "click",
  ()=>{

    state={

      coins:0,

      shots:0,

      goals:0,

      best:0,

      streak:0,

      owned:["teddy"],

      selected:"teddy"

    };


    save();

    updateUI();


    resetModal.classList.remove(
      "open"
    );


    resetBall();

  }
);


resetModal.addEventListener(
  "click",
  e=>{

    if(e.target===resetModal){

      resetModal.classList.remove(
        "open"
      );

    }

  }
);


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
  "resize",
  ()=>{

    if(!shotActive){

      resetBall();

    }

  }
);


/* ==========================================
   START
========================================== */

updateUI();

resetBall();

</script>
